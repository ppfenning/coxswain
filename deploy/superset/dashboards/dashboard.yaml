# A 12-column grid. Each row lists charts by name with a width; widths in a row sum to 12.
#
# `dashboard` stays the single Coxswain dict bootstrap.py's plan() reads (it does
# `dash = specs["dashboard"]`, then `dash["grid"]`), so this key keeps that exact shape.
# `dashboards` below lists all four declaratively, with the anchor reusing Coxswain's grid so
# it is written once. Teaching plan()/apply() to walk `dashboards` and create the Fleet, Chair
# and Crew dashboards on a server is a separate, later change; this file only holds the data.
dashboard: &coxswain
  name: Coxswain
  grid:
    - - {chart: "Cost per turn by model, by day", width: 6}
      - {chart: "Cache-read share by model, by day", width: 6}
    - - {chart: "Cost per landed task, by day", width: 6}
      - {chart: "Landed tasks per day", width: 6}
    - - {chart: "First-try build rate, by day", width: 6}
      - {chart: "Lead time, launch to land (median hours), by day", width: 6}
    - - {chart: "Spend by task outcome, last 14 days", width: 12}
    - - {chart: "Reviewer agreement", width: 4}
      - {chart: "Arbiter decisions", width: 4}
      - {chart: "Build attempts per task", width: 4}
    - - {chart: "Cost per day by model alias", width: 6}
      - {chart: "Cost by role, last 7 days", width: 6}
    - - {chart: "Busy lanes per hour", width: 12}
    - - {chart: "Runs per day", width: 12}
    - - {chart: "Quarantined attempts per day", width: 6}
      - {chart: "Quarantines by cause, last 14 days", width: 6}
    - - {chart: "Tool uses by name, top 15", width: 12}

dashboards:
  - *coxswain
  - name: Fleet
    grid:
      - - {chart: "Chair holder, epoch and beat age", width: 12}
      - - {chart: "Lanes per host over time against capacity", width: 6}
        - {chart: "Host state and last login", width: 6}
      - - {chart: "Needs-chair items by cause", width: 12}
      - - {chart: "Weekly spend against the ceiling", width: 12}
  - name: Chair
    grid:
      - - {chart: "Chair actions per hour by kind", width: 12}
      - - {chart: "Spend per landed task per day", width: 6}
        - {chart: "Needs-chair backlog", width: 6}
  - name: Crew
    grid:
      - - {chart: "Crew cost per day by role", width: 6}
        - {chart: "Crew cost per day by model", width: 6}
      - - {chart: "Crew turns per day by role", width: 6}
        - {chart: "Cache-read share by role", width: 6}
      - - {chart: "Quarantines by role and cause, last 14 days", width: 6}
        - {chart: "Quarantines by repository and cause, last 14 days", width: 6}
