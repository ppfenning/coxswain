# Virtual datasets. `requires` names the source a dataset reads: bootstrap skips a
# dataset, and the charts on it, while that source is absent. DuckDB's read_parquet
# errors on an empty glob and Superset reads the columns when it creates the dataset.
#
# unknown: column names beyond ts, launched_at, ended_at and kind (cost_usd,
# model_alias, role, tool_name) come from the dashboard brief, not from a schema
# read. Check them against cox.db and the compacted traces before trusting a chart.
datasets:
  - name: calls
    database: coxswain
    requires: sqlite
    sql: |
      SELECT *, CAST(ts AS TIMESTAMPTZ) AS at
      FROM {{store:node_calls}}

  - name: runs
    database: coxswain
    requires: sqlite
    sql: |
      SELECT * REPLACE (
        CAST(launched_at AS TIMESTAMPTZ) AS launched_at,
        CAST(ended_at AS TIMESTAMPTZ) AS ended_at
      )
      FROM {{store:runs}}

  - name: attempts
    database: coxswain
    requires: sqlite
    sql: |
      SELECT *, CAST(ts AS TIMESTAMPTZ) AS at
      FROM {{store:attempts}}

  # One row per hour over the last 14 days. A run is busy in an hour when it
  # launched by the hour's end and had not ended before the hour's start.
  - name: lanes_by_hour
    database: coxswain
    requires: sqlite
    sql: |
      WITH hours AS (
        SELECT h AS hour_start, h + INTERVAL 1 HOUR AS hour_end
        FROM generate_series(
          date_trunc('hour', now()) - INTERVAL 14 DAY,
          date_trunc('hour', now()),
          INTERVAL 1 HOUR
        ) AS t(h)
      ),
      r AS (
        SELECT CAST(launched_at AS TIMESTAMPTZ) AS launched_at, CAST(ended_at AS TIMESTAMPTZ) AS ended_at
        FROM {{store:runs}}
      )
      SELECT hours.hour_start, count(r.launched_at) AS busy_lanes
      FROM hours
      LEFT JOIN r ON r.launched_at <= hours.hour_end AND COALESCE(r.ended_at, now()) >= hours.hour_start
      GROUP BY hours.hour_start
      ORDER BY hours.hour_start

  - name: traces
    database: coxswain
    requires: parquet-traces
    sql: |
      SELECT *, tool AS tool_name
      FROM read_parquet('/data/runs/traces/*/*/*/*.parquet')
      WHERE tool IS NOT NULL

  # Cost and cache share by day and model. cache_read_share is a per-group ratio, so a
  # chart over several groups weights it by turns.
  - name: calls_by_day
    database: coxswain
    requires: sqlite
    sql: |
      SELECT CAST(CAST(ts AS TIMESTAMPTZ) AS DATE) AS day, model_alias,
             SUM(cost_usd) AS cost_usd, SUM(turns) AS turns, SUM(cost_usd) / NULLIF(SUM(turns), 0) AS cost_per_turn,
             SUM(cache_read_tokens) * 1.0 / NULLIF(SUM(input_total), 0) AS cache_read_share
      FROM {{store:node_calls}}
      GROUP BY ALL

  # The three datasets below read land.jsonl and cox.db. bootstrap counts land-log present
  # only when both files exist. A task landed when its land record exited 0 and reached mark_done.
  - name: daily_efficiency
    database: coxswain
    requires: land-log
    sql: |
      WITH cost AS (
        SELECT CAST(CAST(ts AS TIMESTAMPTZ) AS DATE) AS day, SUM(cost_usd) AS cost_usd
        FROM {{store:node_calls}} GROUP BY 1
      ),
      landed AS (
        SELECT CAST(CAST(ts AS TIMESTAMPTZ) AS DATE) AS day, COUNT(*) AS landed
        FROM read_json_auto('/data/runs/land.jsonl', format = 'newline_delimited', ignore_errors = true)
        WHERE exit = 0 AND list_contains(steps_reached, 'mark_done') AND task IS NOT NULL
        GROUP BY 1
      )
      SELECT cost.day, cost.cost_usd, COALESCE(landed.landed, 0) AS landed,
             cost.cost_usd / NULLIF(landed.landed, 0) AS cost_per_landed
      FROM cost LEFT JOIN landed USING (day)

  # One row per landed task, with its build count, first-try flag, task cost and lead
  # time from the run's launch.
  - name: landed_tasks
    database: coxswain
    requires: land-log
    sql: |
      WITH landed AS (
        SELECT run, task, CAST(ts AS TIMESTAMPTZ) AS landed_at
        FROM read_json_auto('/data/runs/land.jsonl', format = 'newline_delimited', ignore_errors = true)
        WHERE exit = 0 AND list_contains(steps_reached, 'mark_done') AND task IS NOT NULL
      ),
      builds AS (
        SELECT task_id, COUNT(*) AS builds FROM {{store:node_calls}} WHERE role = 'build' GROUP BY 1
      ),
      spend AS (
        SELECT task_id, SUM(cost_usd) AS cost_usd FROM {{store:node_calls}} GROUP BY 1
      ),
      launch AS (
        SELECT run_id, CAST(launched_at AS TIMESTAMPTZ) AS launched_at FROM {{store:runs}}
      )
      SELECT landed.task, landed.run, landed.landed_at, CAST(landed.landed_at AS DATE) AS day,
             COALESCE(builds.builds, 0) AS builds, COALESCE(builds.builds, 0) = 1 AS first_try,
             spend.cost_usd AS task_cost_usd,
             date_diff('minute', launch.launched_at, landed.landed_at) / 60.0 AS lead_hours
      FROM landed
      LEFT JOIN builds ON builds.task_id = landed.task
      LEFT JOIN spend ON spend.task_id = landed.task
      LEFT JOIN launch ON launch.run_id = landed.run

  # Each task's spend and whether it landed. A task counts as `never landed` once its
  # last call is two days old.
  - name: task_outcomes
    database: coxswain
    requires: land-log
    sql: |
      WITH landed AS (
        SELECT DISTINCT task FROM read_json_auto('/data/runs/land.jsonl', format = 'newline_delimited', ignore_errors = true)
        WHERE exit = 0 AND list_contains(steps_reached, 'mark_done') AND task IS NOT NULL
      ),
      tasks AS (
        SELECT task_id, SUM(cost_usd) AS cost_usd, MAX(CAST(ts AS TIMESTAMPTZ)) AS last_call
        FROM {{store:node_calls}} WHERE task_id IS NOT NULL GROUP BY 1
      )
      SELECT task_id, cost_usd, last_call, CAST(last_call AS DATE) AS day,
             CASE WHEN task_id IN (SELECT task FROM landed) THEN 'landed'
                  WHEN last_call < now() - INTERVAL 2 DAY THEN 'never landed'
                  ELSE 'in flight' END AS outcome
      FROM tasks

  # One row per task record, with the review, adversary and arbiter verdicts and the
  # build attempt count pulled out of the record's JSON.
  - name: task_verdicts
    database: coxswain
    requires: sqlite
    sql: |
      SELECT run_id, task_id,
             COALESCE(json_extract_string(record_json, '$.review.verdict'), 'none') AS charter_verdict,
             COALESCE(json_extract_string(record_json, '$.adversary.verdict'), 'none') AS adversary_verdict,
             COALESCE(json_extract_string(record_json, '$.arbitration.verdict'), 'not needed') AS arbiter_verdict,
             CAST(json_extract(record_json, '$.fix_loop.attempts') AS DOUBLE) AS build_attempts,
             json_extract_string(record_json, '$.fix_loop.stopped') AS stopped,
             CAST(updated_at AS TIMESTAMPTZ) AS at
      FROM {{store:task_records}}

  # Chair datasets. All read the store only, and all require chair-store. bootstrap runs a
  # LIMIT 0 select on every column below that these datasets read, and skips them until each
  # select runs. `cox chair run` in another repository writes chair_actions and chair_ticks.
  # This file assumes these columns and creates nothing.
  #   chair_actions: ts, epoch, kind, initiative, task, status, reason. kind is one of land,
  #     launch_epic, launch_decompose, rescue, relaunch, needs_chair, standby.
  #   chair_ticks: ts, holder, host, epoch, max_in_flight, weekly_fraction.
  #   leases: name, holder, host, epoch, heartbeat_at, expires_at. Times are UTC text,
  #     YYYY-MM-DDTHH:MM:SSZ. heartbeat_at is the renewal time.
  #   runs: host, empty for a run on this machine.
  #
  # A task landed when a chair_actions row has kind land and status ok, at that row's ts.
  # task_records is not the source: this repo holds no DDL for it, and the record_json paths
  # read here (review, adversary, arbitration, fix_loop) carry no land state. So these datasets
  # count only the lands the chair loop made.
  # unknown: the success value `ok`, the lease name `chair` and the host column on leases come
  # from the task's contract, not a schema read. The probe checks the columns, not the values.
  #
  # Every timestamp here is a naive UTC TIMESTAMP, never TIMESTAMPTZ. DuckDB needs a timezone
  # package to hand a timezone-aware value to Python, and coxswain does not declare one. The
  # stored text is UTC, so CAST(ts AS TIMESTAMP) reads it as UTC, and now() AT TIME ZONE 'UTC'
  # is the naive UTC clock to compare it with.
  - name: chair_actions_by_hour
    database: coxswain
    requires: chair-store
    sql: |
      SELECT date_trunc('hour', CAST(ts AS TIMESTAMP)) AS hour, kind, COUNT(*) AS actions
      FROM {{store:chair_actions}}
      WHERE kind IN ('land', 'launch_epic', 'launch_decompose', 'rescue', 'relaunch', 'needs_chair', 'standby')
      GROUP BY ALL

  # lanes_by_hour split by host, over the same 14 days. max_in_flight is the newest chair tick
  # at or before the hour's start, NULL when no tick exists yet.
  - name: chair_lanes_by_host_hour
    database: coxswain
    requires: chair-store
    sql: |
      WITH hours AS (
        SELECT h AS hour_start, h + INTERVAL 1 HOUR AS hour_end
        FROM generate_series(
          date_trunc('hour', CAST(now() AT TIME ZONE 'UTC' AS TIMESTAMP)) - INTERVAL 14 DAY,
          date_trunc('hour', CAST(now() AT TIME ZONE 'UTC' AS TIMESTAMP)),
          INTERVAL 1 HOUR
        ) AS t(h)
      ),
      r AS (
        SELECT CAST(launched_at AS TIMESTAMP) AS launched_at, CAST(ended_at AS TIMESTAMP) AS ended_at,
               COALESCE(NULLIF(host, ''), 'local') AS host
        FROM {{store:runs}}
      ),
      ticks AS (
        SELECT CAST(ts AS TIMESTAMP) AS ts, max_in_flight FROM {{store:chair_ticks}}
      ),
      busy AS (
        SELECT hours.hour_start, r.host, COUNT(*) AS lanes
        FROM hours
        JOIN r ON r.launched_at <= hours.hour_end
              AND COALESCE(r.ended_at, CAST(now() AT TIME ZONE 'UTC' AS TIMESTAMP)) >= hours.hour_start
        GROUP BY ALL
      )
      SELECT busy.hour_start AS hour, busy.host, busy.lanes,
             (SELECT t.max_in_flight FROM ticks AS t WHERE t.ts <= busy.hour_start ORDER BY t.ts DESC LIMIT 1) AS max_in_flight
      FROM busy
      ORDER BY hour, host

  # One row per day with node_calls cost or a chair tick. loop_cost_per_landed is the literal 0.0
  # on a day with a chair tick and NULL otherwise. The zero is true: the chair loop makes no
  # model calls, so it adds nothing to cost_usd. A tick day with no calls shows cost_usd 0.0.
  - name: chair_spend_by_day
    database: coxswain
    requires: chair-store
    sql: |
      WITH cost AS (
        SELECT CAST(CAST(ts AS TIMESTAMP) AS DATE) AS day, SUM(cost_usd) AS cost_usd
        FROM {{store:node_calls}} GROUP BY 1
      ),
      landed AS (
        SELECT CAST(CAST(ts AS TIMESTAMP) AS DATE) AS day, COUNT(DISTINCT concat_ws('/', initiative, task)) AS landed
        FROM {{store:chair_actions}}
        WHERE kind = 'land' AND status = 'ok'
        GROUP BY 1
      ),
      tick_days AS (
        SELECT DISTINCT CAST(CAST(ts AS TIMESTAMP) AS DATE) AS day FROM {{store:chair_ticks}}
      ),
      days AS (
        SELECT day FROM cost UNION SELECT day FROM tick_days
      )
      SELECT days.day, COALESCE(cost.cost_usd, 0.0) AS cost_usd, COALESCE(landed.landed, 0) AS landed,
             COALESCE(cost.cost_usd, 0.0) / NULLIF(landed.landed, 0) AS cost_per_landed,
             CASE WHEN days.day IN (SELECT day FROM tick_days) THEN 0.0 ELSE NULL END AS loop_cost_per_landed
      FROM days
      LEFT JOIN cost ON cost.day = days.day
      LEFT JOIN landed ON landed.day = days.day
      ORDER BY days.day

  # The newest needs_chair action per initiative and task, unless a successful land action
  # for the same task came after it. A failed land leaves the task waiting.
  - name: chair_needs_backlog
    database: coxswain
    requires: chair-store
    sql: |
      WITH flagged AS (
        SELECT initiative, task, reason, CAST(ts AS TIMESTAMP) AS flagged_at,
               ROW_NUMBER() OVER (PARTITION BY initiative, task ORDER BY CAST(ts AS TIMESTAMP) DESC) AS rn
        FROM {{store:chair_actions}} WHERE kind = 'needs_chair'
      ),
      landed AS (
        SELECT initiative, task, CAST(ts AS TIMESTAMP) AS landed_at
        FROM {{store:chair_actions}} WHERE kind = 'land' AND status = 'ok'
      )
      SELECT f.initiative, f.task, f.reason, f.flagged_at,
             date_diff('minute', f.flagged_at, CAST(now() AT TIME ZONE 'UTC' AS TIMESTAMP)) / 60.0 AS waiting_hours
      FROM flagged AS f
      WHERE f.rn = 1
        AND NOT EXISTS (
          SELECT 1 FROM landed AS l WHERE l.initiative = f.initiative AND l.task = f.task AND l.landed_at > f.flagged_at
        )

  # One row. The lease columns are NULL while no chair lease exists.
  - name: chair_status
    database: coxswain
    requires: chair-store
    sql: |
      WITH lease AS (
        SELECT holder, host, epoch, CAST(heartbeat_at AS TIMESTAMP) AS heartbeat_at
        FROM {{store:leases}} WHERE name = 'chair'
      ),
      tick AS (
        SELECT weekly_fraction FROM {{store:chair_ticks}} ORDER BY CAST(ts AS TIMESTAMP) DESC LIMIT 1
      )
      SELECT lease.holder, lease.host, lease.epoch,
             date_diff('second', lease.heartbeat_at, CAST(now() AT TIME ZONE 'UTC' AS TIMESTAMP)) AS beat_age_seconds,
             (SELECT weekly_fraction FROM tick) AS weekly_fraction
      FROM (SELECT 1) AS one LEFT JOIN lease ON true
