# Virtual datasets. `requires` names the source a dataset reads: `lake` or `store`. bootstrap
# skips a dataset, and the charts on it, while that source's connection probe hasn't succeeded
# yet. Superset reads the columns when it creates the dataset.
#
# unknown: column names beyond ts, launched_at, ended_at and kind (cost_usd,
# model_alias, role, tool_name) come from the dashboard brief, not from a schema
# read. Check them against cox.db and the compacted traces before trusting a chart.
datasets:
  - name: calls
    database: coxswain
    requires: lake
    sql: |
      SELECT *, CAST(ts AS TIMESTAMPTZ) AS at
      FROM {{lake:node_calls}}

  - name: runs
    database: coxswain
    requires: lake
    sql: |
      SELECT * REPLACE (
        CAST(launched_at AS TIMESTAMPTZ) AS launched_at,
        CAST(ended_at AS TIMESTAMPTZ) AS ended_at
      )
      FROM {{lake:runs}}

  - name: attempts
    database: coxswain
    requires: lake
    sql: |
      SELECT *, CAST(ts AS TIMESTAMPTZ) AS at
      FROM {{store:attempts}}

  # One row per hour over the last 14 days. A run is busy in an hour when it
  # launched by the hour's end and had not ended before the hour's start.
  - name: lanes_by_hour
    database: coxswain
    requires: lake
    sql: |
      WITH hours AS (
        SELECT h AS hour_start, h + INTERVAL 1 HOUR AS hour_end
        FROM generate_series(
          date_trunc('hour', now()) - INTERVAL 14 DAY,
          date_trunc('hour', now()),
          INTERVAL 1 HOUR
        ) AS t(h)
      ),
      r AS (
        SELECT CAST(launched_at AS TIMESTAMPTZ) AS launched_at, CAST(ended_at AS TIMESTAMPTZ) AS ended_at
        FROM {{lake:runs}}
      )
      SELECT hours.hour_start, count(r.launched_at) AS busy_lanes
      FROM hours
      LEFT JOIN r ON r.launched_at <= hours.hour_end AND COALESCE(r.ended_at, now()) >= hours.hour_start
      GROUP BY hours.hour_start
      ORDER BY hours.hour_start

  - name: traces
    database: coxswain
    requires: lake
    sql: |
      SELECT *, tool AS tool_name
      FROM {{lake:traces}}
      WHERE tool IS NOT NULL

  # Cost and cache share by day and model. cache_read_share is a per-group ratio, so a
  # chart over several groups weights it by turns.
  - name: calls_by_day
    database: coxswain
    requires: lake
    sql: |
      SELECT CAST(CAST(ts AS TIMESTAMPTZ) AS DATE) AS day, model_alias,
             SUM(cost_usd) AS cost_usd, SUM(turns) AS turns, SUM(cost_usd) / NULLIF(SUM(turns), 0) AS cost_per_turn,
             SUM(cache_read_tokens) * 1.0 / NULLIF(SUM(input_total), 0) AS cache_read_share
      FROM {{lake:node_calls}}
      GROUP BY ALL

  # The three datasets below also read land.jsonl directly. `requires: lake` gates dataset
  # creation on the lake connection, not on land.jsonl's existence, so land.jsonl must be
  # mounted before the first bootstrap run against a fresh runs directory. A task landed
  # when its land record exited 0 and reached mark_done.
  - name: daily_efficiency
    database: coxswain
    requires: lake
    sql: |
      WITH cost AS (
        SELECT CAST(CAST(ts AS TIMESTAMPTZ) AS DATE) AS day, SUM(cost_usd) AS cost_usd
        FROM {{lake:node_calls}} GROUP BY 1
      ),
      landed AS (
        SELECT CAST(CAST(ts AS TIMESTAMPTZ) AS DATE) AS day, COUNT(*) AS landed
        FROM read_json_auto('/data/runs/land.jsonl', format = 'newline_delimited', ignore_errors = true)
        WHERE exit = 0 AND list_contains(steps_reached, 'mark_done') AND task IS NOT NULL
        GROUP BY 1
      )
      SELECT cost.day, cost.cost_usd, COALESCE(landed.landed, 0) AS landed,
             cost.cost_usd / NULLIF(landed.landed, 0) AS cost_per_landed
      FROM cost LEFT JOIN landed USING (day)

  # One row per landed task, with its build count, first-try flag, task cost and lead
  # time from the run's launch.
  - name: landed_tasks
    database: coxswain
    requires: lake
    sql: |
      WITH landed AS (
        SELECT run, task, CAST(ts AS TIMESTAMPTZ) AS landed_at
        FROM read_json_auto('/data/runs/land.jsonl', format = 'newline_delimited', ignore_errors = true)
        WHERE exit = 0 AND list_contains(steps_reached, 'mark_done') AND task IS NOT NULL
      ),
      builds AS (
        SELECT task_id, COUNT(*) AS builds FROM {{lake:node_calls}} WHERE role = 'build' GROUP BY 1
      ),
      spend AS (
        SELECT task_id, SUM(cost_usd) AS cost_usd FROM {{lake:node_calls}} GROUP BY 1
      ),
      launch AS (
        SELECT run_id, CAST(launched_at AS TIMESTAMPTZ) AS launched_at FROM {{lake:runs}}
      )
      SELECT landed.task, landed.run, landed.landed_at, CAST(landed.landed_at AS DATE) AS day,
             COALESCE(builds.builds, 0) AS builds, COALESCE(builds.builds, 0) = 1 AS first_try,
             spend.cost_usd AS task_cost_usd,
             date_diff('minute', launch.launched_at, landed.landed_at) / 60.0 AS lead_hours
      FROM landed
      LEFT JOIN builds ON builds.task_id = landed.task
      LEFT JOIN spend ON spend.task_id = landed.task
      LEFT JOIN launch ON launch.run_id = landed.run

  # Each task's spend and whether it landed. A task counts as `never landed` once its
  # last call is two days old.
  - name: task_outcomes
    database: coxswain
    requires: lake
    sql: |
      WITH landed AS (
        SELECT DISTINCT task FROM read_json_auto('/data/runs/land.jsonl', format = 'newline_delimited', ignore_errors = true)
        WHERE exit = 0 AND list_contains(steps_reached, 'mark_done') AND task IS NOT NULL
      ),
      tasks AS (
        SELECT task_id, SUM(cost_usd) AS cost_usd, MAX(CAST(ts AS TIMESTAMPTZ)) AS last_call
        FROM {{lake:node_calls}} WHERE task_id IS NOT NULL GROUP BY 1
      )
      SELECT task_id, cost_usd, last_call, CAST(last_call AS DATE) AS day,
             CASE WHEN task_id IN (SELECT task FROM landed) THEN 'landed'
                  WHEN last_call < now() - INTERVAL 2 DAY THEN 'never landed'
                  ELSE 'in flight' END AS outcome
      FROM tasks

  # One row per task record, with the review, adversary and arbiter verdicts and the
  # build attempt count pulled out of the record's JSON.
  - name: task_verdicts
    database: coxswain
    requires: lake
    sql: |
      SELECT run_id, task_id,
             COALESCE(json_extract_string(record_json, '$.review.verdict'), 'none') AS charter_verdict,
             COALESCE(json_extract_string(record_json, '$.adversary.verdict'), 'none') AS adversary_verdict,
             COALESCE(json_extract_string(record_json, '$.arbitration.verdict'), 'not needed') AS arbiter_verdict,
             CAST(json_extract(record_json, '$.fix_loop.attempts') AS DOUBLE) AS build_attempts,
             json_extract_string(record_json, '$.fix_loop.stopped') AS stopped,
             CAST(updated_at AS TIMESTAMPTZ) AS at
      FROM {{store:task_records}}

  # Chair datasets. All read the store only, and all require store. bootstrap runs a
  # WHERE false select on every column below that these datasets read, and skips them until
  # each select runs. `cox chair run` in another repository writes chair_actions. There is no
  # chair_ticks table and nothing writes one; every dataset below that used to read it now
  # reads chair_actions, leases or hosts instead.
  #   chair_actions: ts, epoch, holder, kind, target, status, reason, action_json. kind is one
  #     of land, land_phase, launch_epic, launch_decompose, rescue, relaunch, needs_chair,
  #     standby. target is the initiative/run/phase/task key the action is about; the display
  #     columns that used to be plain initiative/task columns are pulled out of action_json,
  #     the one place the richer identifying fields (initiative, run, phase, reason) live.
  #   leases: name, holder, epoch, heartbeat_at, expires_at. Times are UTC text,
  #     YYYY-MM-DDTHH:MM:SSZ. heartbeat_at is the renewal time. holder is `label@host:pid`;
  #     there is no separate host column, so host is parsed out of holder.
  #   hosts: name, ssh, capacity, state, beat_at, versions_json, updated_at, updated_by.
  #     login_ok and login_checked_at are not columns; they live inside versions_json.
  #   runs: host, empty for a run on this machine.
  #
  # A task landed when a chair_actions row has kind land or land_phase and status landed, at
  # that row's ts, for the same target a needs_chair row named.
  # task_records is not the source: this repo holds no DDL for it, and the record_json paths
  # read here (review, adversary, arbitration, fix_loop) carry no land state. So these datasets
  # count only the lands the chair loop made.
  # unknown: the status value `landed`, the lease name `chair`, the `label@host:pid` shape of
  # holder and the action_json field names (initiative, run, phase, reason) come from the
  # task's contract, not a schema read. The probe checks the columns, not the values.
  #
  # Every timestamp here is a naive UTC TIMESTAMP, never TIMESTAMPTZ. DuckDB needs a timezone
  # package to hand a timezone-aware value to Python, and coxswain does not declare one. The
  # stored text is UTC, so CAST(ts AS TIMESTAMP) reads it as UTC, and now() AT TIME ZONE 'UTC'
  # is the naive UTC clock to compare it with.
  - name: chair_actions_by_hour
    database: coxswain
    requires: store
    sql: |
      SELECT date_trunc('hour', CAST(ts AS TIMESTAMP)) AS hour, kind, COUNT(*) AS actions
      FROM {{store:chair_actions}}
      WHERE kind IN ('land', 'launch_epic', 'launch_decompose', 'rescue', 'relaunch', 'needs_chair', 'standby')
      GROUP BY ALL

  # lanes_by_hour split by host, over the same 14 days, against that host's capacity from the
  # hosts table (NULL when the host is not in hosts, which is expected for 'local').
  - name: chair_lanes_by_host_hour
    database: coxswain
    requires: store
    sql: |
      WITH hours AS (
        SELECT h AS hour_start, h + INTERVAL 1 HOUR AS hour_end
        FROM generate_series(
          date_trunc('hour', CAST(now() AT TIME ZONE 'UTC' AS TIMESTAMP)) - INTERVAL 14 DAY,
          date_trunc('hour', CAST(now() AT TIME ZONE 'UTC' AS TIMESTAMP)),
          INTERVAL 1 HOUR
        ) AS t(h)
      ),
      r AS (
        SELECT CAST(launched_at AS TIMESTAMP) AS launched_at, CAST(ended_at AS TIMESTAMP) AS ended_at,
               COALESCE(NULLIF(host, ''), 'local') AS host
        FROM {{store:runs}}
      ),
      busy AS (
        SELECT hours.hour_start, r.host, COUNT(*) AS lanes
        FROM hours
        JOIN r ON r.launched_at <= hours.hour_end
              AND COALESCE(r.ended_at, CAST(now() AT TIME ZONE 'UTC' AS TIMESTAMP)) >= hours.hour_start
        GROUP BY ALL
      )
      SELECT busy.hour_start AS hour, busy.host, busy.lanes, hosts.capacity
      FROM busy
      LEFT JOIN {{store:hosts}} AS hosts ON hosts.name = busy.host
      ORDER BY hour, host

  # One row per day with node_calls cost. There is no chair_ticks table any more to mark a day
  # the chair loop ran but made no model calls, so this dataset lists cost days only.
  - name: chair_spend_by_day
    database: coxswain
    requires: store
    sql: |
      WITH cost AS (
        SELECT CAST(CAST(ts AS TIMESTAMP) AS DATE) AS day, SUM(cost_usd) AS cost_usd
        FROM {{store:node_calls}} GROUP BY 1
      ),
      landed AS (
        SELECT CAST(CAST(ts AS TIMESTAMP) AS DATE) AS day, COUNT(DISTINCT target) AS landed
        FROM {{store:chair_actions}}
        WHERE kind IN ('land', 'land_phase') AND status = 'landed'
        GROUP BY 1
      )
      SELECT cost.day, cost.cost_usd, COALESCE(landed.landed, 0) AS landed,
             cost.cost_usd / NULLIF(landed.landed, 0) AS cost_per_landed
      FROM cost
      LEFT JOIN landed ON landed.day = cost.day
      ORDER BY cost.day

  # The newest needs_chair action per target, unless a landed action for the same target came
  # after it. A failed or missing land leaves the target waiting. initiative, run, phase and
  # reason are display columns pulled out of action_json; target is the key everything joins on.
  - name: chair_needs_backlog
    database: coxswain
    requires: store
    sql: |
      WITH flagged AS (
        SELECT target,
               json_extract_string(action_json, '$.initiative') AS initiative,
               json_extract_string(action_json, '$.run') AS run,
               json_extract_string(action_json, '$.phase') AS phase,
               json_extract_string(action_json, '$.reason') AS reason,
               CAST(ts AS TIMESTAMP) AS flagged_at,
               ROW_NUMBER() OVER (PARTITION BY target ORDER BY CAST(ts AS TIMESTAMP) DESC) AS rn
        FROM {{store:chair_actions}} WHERE kind = 'needs_chair'
      ),
      landed AS (
        SELECT target, CAST(ts AS TIMESTAMP) AS landed_at
        FROM {{store:chair_actions}} WHERE kind IN ('land', 'land_phase') AND status = 'landed'
      )
      SELECT f.target, f.initiative, f.run, f.phase, f.reason, f.flagged_at,
             date_diff('minute', f.flagged_at, CAST(now() AT TIME ZONE 'UTC' AS TIMESTAMP)) / 60.0 AS waiting_hours
      FROM flagged AS f
      WHERE f.rn = 1
        AND NOT EXISTS (
          SELECT 1 FROM landed AS l WHERE l.target = f.target AND l.landed_at > f.flagged_at
        )

  # One row. The lease columns are NULL while no chair lease exists. leases has no host column,
  # so host is parsed out of holder's `label@host:pid` form. No weekly_fraction: that read the
  # gone chair_ticks table, and the weekly ceiling is profile config, not store data.
  - name: chair_status
    database: coxswain
    requires: store
    sql: |
      WITH lease AS (
        SELECT holder, regexp_extract(holder, '@([^:]+):', 1) AS host, epoch,
               CAST(heartbeat_at AS TIMESTAMP) AS heartbeat_at
        FROM {{store:leases}} WHERE name = 'chair'
      )
      SELECT lease.holder, lease.host, lease.epoch,
             date_diff('second', lease.heartbeat_at, CAST(now() AT TIME ZONE 'UTC' AS TIMESTAMP)) AS beat_age_seconds
      FROM (SELECT 1) AS one LEFT JOIN lease ON true

  # Fleet datasets: host state, needs-chair by cause, weekly spend.
  # All read the store only, through {{store:<table>}} like the chair datasets above. Every
  # timestamp here is a naive UTC TIMESTAMP too, so DuckDB needs no pytz.

  # One row per host, from the store's hosts table (name, state, capacity). login_ok and
  # login_checked_at are not columns on hosts; both live inside versions_json.
  - name: fleet_host_state
    database: coxswain
    requires: store
    sql: |
      SELECT name, state, capacity, CAST(beat_at AS TIMESTAMP) AS beat_at,
             CAST(json_extract(versions_json, '$.login_ok') AS BOOLEAN) AS login_ok,
             CAST(json_extract_string(versions_json, '$.login_checked_at') AS TIMESTAMP) AS login_checked_at
      FROM {{store:hosts}}

  # chair_needs_backlog's own logic (the newest needs_chair action per target, unless a later
  # landed action came after it), grouped by reason instead of listed per target.
  - name: fleet_needs_chair_by_cause
    database: coxswain
    requires: store
    sql: |
      WITH flagged AS (
        SELECT target, json_extract_string(action_json, '$.reason') AS reason, CAST(ts AS TIMESTAMP) AS flagged_at,
               ROW_NUMBER() OVER (PARTITION BY target ORDER BY CAST(ts AS TIMESTAMP) DESC) AS rn
        FROM {{store:chair_actions}} WHERE kind = 'needs_chair'
      ),
      landed AS (
        SELECT target, CAST(ts AS TIMESTAMP) AS landed_at
        FROM {{store:chair_actions}} WHERE kind IN ('land', 'land_phase') AND status = 'landed'
      ),
      waiting AS (
        SELECT f.reason, f.flagged_at
        FROM flagged AS f
        WHERE f.rn = 1
          AND NOT EXISTS (
            SELECT 1 FROM landed AS l WHERE l.target = f.target AND l.landed_at > f.flagged_at
          )
      )
      SELECT reason AS cause, COUNT(*) AS items,
             MAX(date_diff('minute', flagged_at, CAST(now() AT TIME ZONE 'UTC' AS TIMESTAMP))) / 60.0 AS oldest_waiting_hours
      FROM waiting
      GROUP BY reason

  # No fleet_drafts_waiting_approval dataset: it needs a not-yet-approved draft state on
  # task_records and the time a task entered it. This repo holds no DDL for task_records.
  # task_verdicts reads it as run_id, task_id, record_json and updated_at, and no record_json
  # path read here names a draft or approval state. Without that filter the dataset would list
  # approved work as waiting, so it waits until the store's schema names the state column.

  # Dollars per week, not a fraction: the weekly ceiling lives in profile config, not the
  # store, so this dataset carries no fraction column. One row per week that has spend, over
  # the trailing 12 weeks from now, so an idle week before that window doesn't linger forever.
  - name: fleet_weekly_spend
    database: coxswain
    requires: store
    sql: |
      SELECT date_trunc('week', CAST(ts AS TIMESTAMP)) AS week, SUM(cost_usd) AS cost_usd
      FROM {{store:node_calls}}
      WHERE CAST(ts AS TIMESTAMP) >= date_trunc('week', CAST(now() AT TIME ZONE 'UTC' AS TIMESTAMP)) - INTERVAL 12 WEEK
      GROUP BY 1
      ORDER BY 1
