# Charts. `params` is Superset's form data without the datasource, which bootstrap adds.
charts:
  - name: Cost per day by model alias
    dataset: calls
    viz_type: echarts_timeseries_bar
    params:
      x_axis: occurred_at
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SIMPLE, column: {column_name: cost_usd}, aggregate: SUM, label: cost_usd}
      groupby: [model_alias]
      stack: true

  - name: Cost by role, last 7 days
    dataset: calls
    viz_type: echarts_timeseries_bar
    params:
      x_axis: role
      metrics:
        - {expressionType: SIMPLE, column: {column_name: cost_usd}, aggregate: SUM, label: cost_usd}
      adhoc_filters:
        - {expressionType: SIMPLE, clause: WHERE, subject: occurred_at, operator: TEMPORAL_RANGE, comparator: Last week}

  - name: Busy lanes per hour
    dataset: lanes_by_hour
    viz_type: echarts_timeseries_line
    params:
      x_axis: hour_start
      time_grain_sqla: PT1H
      metrics:
        - {expressionType: SIMPLE, column: {column_name: busy_lanes}, aggregate: MAX, label: busy_lanes}

  - name: Runs per day
    dataset: runs
    viz_type: echarts_timeseries_bar
    params:
      x_axis: launched_at
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SQL, sqlExpression: COUNT(*), label: runs}

  # An attempt is a quarantine when its kind is one of counts_kinds. The four kinds
  # are the ones the 0.6.0 release notes name. unknown: whether attempts.kind spells
  # them the same way; check the table before trusting this chart.
  - name: Quarantined attempts per day
    dataset: attempts
    viz_type: echarts_timeseries_bar
    counts_kinds: &quarantine_kinds [refused, unverified, infra, dropped]
    params:
      x_axis: occurred_at
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SQL, sqlExpression: COUNT(*), label: quarantined}
      adhoc_filters:
        - {expressionType: SIMPLE, clause: WHERE, subject: kind, operator: IN, comparator: *quarantine_kinds}

  # unknown: whether attempts has a cause column; check the table before trusting this chart.
  - name: Quarantines by cause, last 14 days
    dataset: attempts
    viz_type: echarts_timeseries_bar
    params:
      x_axis: cause
      metrics:
        - {expressionType: SQL, sqlExpression: COUNT(*), label: quarantined}
      adhoc_filters:
        - {expressionType: SIMPLE, clause: WHERE, subject: kind, operator: IN, comparator: *quarantine_kinds}
        - {expressionType: SIMPLE, clause: WHERE, subject: occurred_at, operator: TEMPORAL_RANGE, comparator: Last 2 weeks}

  - name: Tool uses by name, top 15
    dataset: traces
    viz_type: echarts_timeseries_bar
    params:
      x_axis: tool_name
      metrics:
        - {expressionType: SQL, sqlExpression: COUNT(*), label: tool_uses}
      x_axis_sort: tool_uses
      x_axis_sort_asc: false
      row_limit: 15

  # Efficiency. Cost per turn and cost per landed divide summed parts. Cache-read share has no
  # token parts in calls_by_day, so above a one-day grain it is a turn-weighted mean of daily shares.
  - name: Cost per turn by model, by day
    dataset: calls_by_day
    viz_type: echarts_timeseries_line
    params:
      x_axis: day
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SQL, sqlExpression: "SUM(cost_usd) / NULLIF(SUM(turns), 0)", label: cost_per_turn}
      groupby: [model_alias]

  - name: Cache-read share by model, by day
    dataset: calls_by_day
    viz_type: echarts_timeseries_line
    params:
      x_axis: day
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SQL, sqlExpression: "SUM(cache_read_share * turns) / NULLIF(SUM(turns), 0)", label: cache_read_share}
      groupby: [model_alias]

  - name: Cost per landed task, by day
    dataset: daily_efficiency
    viz_type: echarts_timeseries_bar
    params:
      x_axis: day
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SQL, sqlExpression: "SUM(cost_usd) / NULLIF(SUM(landed), 0)", label: cost_per_landed}

  - name: Landed tasks per day
    dataset: daily_efficiency
    viz_type: echarts_timeseries_bar
    params:
      x_axis: day
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SQL, sqlExpression: "SUM(landed)", label: landed}

  - name: First-try build rate, by day
    dataset: landed_tasks
    viz_type: echarts_timeseries_line
    params:
      x_axis: day
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SQL, sqlExpression: "AVG(CAST(first_try AS INTEGER))", label: first_try_rate}

  - name: Lead time, launch to land (median hours), by day
    dataset: landed_tasks
    viz_type: echarts_timeseries_line
    params:
      x_axis: day
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SQL, sqlExpression: "MEDIAN(lead_hours)", label: lead_hours}

  # The dataset's day is a DATE, so the temporal filter reads last_call.
  - name: Spend by task outcome, last 14 days
    dataset: task_outcomes
    viz_type: echarts_timeseries_bar
    params:
      x_axis: outcome
      metrics:
        - {expressionType: SQL, sqlExpression: "SUM(cost_usd)", label: cost_usd}
      adhoc_filters:
        - {expressionType: SIMPLE, clause: WHERE, subject: last_call, operator: TEMPORAL_RANGE, comparator: Last 2 weeks}

  - name: Reviewer agreement
    dataset: task_verdicts
    viz_type: echarts_timeseries_bar
    params:
      x_axis: charter_verdict
      metrics:
        - {expressionType: SQL, sqlExpression: "COUNT(*)", label: tasks}
      groupby: [adversary_verdict]
      stack: true

  - name: Arbiter decisions
    dataset: task_verdicts
    viz_type: echarts_timeseries_bar
    params:
      x_axis: arbiter_verdict
      metrics:
        - {expressionType: SQL, sqlExpression: "COUNT(*)", label: tasks}

  - name: Build attempts per task
    dataset: task_verdicts
    viz_type: echarts_timeseries_bar
    params:
      x_axis: build_attempts
      metrics:
        - {expressionType: SQL, sqlExpression: "COUNT(*)", label: tasks}

  # Fleet charts. chair_lanes_by_host_hour, chair_status, fleet_needs_chair_by_cause and
  # fleet_weekly_spend require chair-store, the same source as the Chair charts below;
  # fleet_host_state requires hosts-table instead. No chart here reads
  # fleet_drafts_waiting_approval: datasets.yaml has no such dataset yet (it says why, and
  # test_the_fleet_sql_runs_over_literal_rows_in_duckdb guards its absence), so the Fleet
  # dashboard ships five charts, not the six the brief names, until that dataset lands.
  # max_in_flight is gone from chair_lanes_by_host_hour; capacity is the column it joins in
  # from hosts, so the cap line now tracks that instead.
  - name: Lanes per host over time against capacity
    dataset: chair_lanes_by_host_hour
    viz_type: echarts_timeseries_line
    params:
      x_axis: hour
      time_grain_sqla: PT1H
      metrics:
        - {expressionType: SIMPLE, column: {column_name: lanes}, aggregate: MAX, label: lanes}
        - {expressionType: SIMPLE, column: {column_name: capacity}, aggregate: MAX, label: cap}
      groupby: [host]

  # Table charts use Superset's raw query_mode (all_columns) to list plain columns. queries_of
  # has no branch for all_columns, so the "queries" it saves for these stays empty apart from
  # any x_axis_sort; that only shapes the query_context bootstrap saves, not what all_columns
  # renders in Superset.
  # fleet_host_state's host column is named name, and its login timestamp is login_checked_at.
  - name: Host state and last login
    dataset: fleet_host_state
    viz_type: table
    params:
      query_mode: raw
      all_columns: [name, state, login_checked_at]
      metrics: []

  # chair_status carries no weekly_fraction: that read the retired chair_ticks table, and the
  # weekly ceiling is profile config, not store data.
  - name: Chair holder, epoch and beat age
    dataset: chair_status
    viz_type: table
    params:
      query_mode: raw
      all_columns: [holder, host, epoch, beat_age_seconds]
      metrics: []

  - name: Needs-chair items by cause
    dataset: fleet_needs_chair_by_cause
    viz_type: echarts_timeseries_bar
    params:
      x_axis: cause
      metrics:
        - {expressionType: SIMPLE, column: {column_name: items}, aggregate: SUM, label: items}

  # fleet_weekly_spend carries week and cost_usd only, not cumulative_cost_usd or weekly_fraction:
  # the weekly ceiling lives in profile config, not the store. Plots dollars per week instead.
  - name: Weekly spend against the ceiling
    dataset: fleet_weekly_spend
    viz_type: echarts_timeseries_line
    params:
      x_axis: week
      time_grain_sqla: P1W
      metrics:
        - {expressionType: SIMPLE, column: {column_name: cost_usd}, aggregate: SUM, label: spend}

  # Chair charts.
  - name: Chair actions per hour by kind
    dataset: chair_actions_by_hour
    viz_type: echarts_timeseries_bar
    params:
      x_axis: hour
      time_grain_sqla: PT1H
      metrics:
        - {expressionType: SIMPLE, column: {column_name: actions}, aggregate: SUM, label: actions}
      groupby: [kind]
      stack: true

  # loop_cost_per_landed is gone: chair_spend_by_day carries one cost_per_landed column now that
  # chair_ticks, and the loop/interactive split it fed, no longer exist.
  - name: Spend per landed task per day
    dataset: chair_spend_by_day
    viz_type: echarts_timeseries_line
    params:
      x_axis: day
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SIMPLE, column: {column_name: cost_per_landed}, aggregate: MAX, label: "cost per landed"}

  # chair_needs_backlog's key column is target, not task.
  - name: Needs-chair backlog
    dataset: chair_needs_backlog
    viz_type: table
    params:
      query_mode: raw
      all_columns: [initiative, target, reason, flagged_at, waiting_hours]
      metrics: []
      x_axis_sort: waiting_hours
      x_axis_sort_asc: false

  # Crew charts. crew_calls carries one row per day, role and model_alias; crew_quarantines one
  # row per quarantined attempt, with its timestamp named at.
  - name: Crew cost per day by role
    dataset: crew_calls
    viz_type: echarts_timeseries_bar
    params:
      x_axis: day
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SQL, sqlExpression: SUM(cost_usd), label: cost_usd}
      groupby: [role]
      stack: true

  - name: Crew cost per day by model
    dataset: crew_calls
    viz_type: echarts_timeseries_bar
    params:
      x_axis: day
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SQL, sqlExpression: SUM(cost_usd), label: cost_usd}
      groupby: [model_alias]
      stack: true

  - name: Crew turns per day by role
    dataset: crew_calls
    viz_type: echarts_timeseries_line
    params:
      x_axis: day
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SQL, sqlExpression: SUM(turns), label: turns}
      groupby: [role]

  - name: Cache-read share by role
    dataset: crew_calls
    viz_type: echarts_timeseries_bar
    params:
      x_axis: role
      metrics:
        - {expressionType: SQL, sqlExpression: "SUM(cache_read_tokens) * 1.0 / NULLIF(SUM(input_total), 0)", label: cache_read_share}
      adhoc_filters:
        - {expressionType: SIMPLE, clause: WHERE, subject: day, operator: TEMPORAL_RANGE, comparator: Last 2 weeks}

  - name: Quarantines by role and cause, last 14 days
    dataset: crew_quarantines
    viz_type: echarts_timeseries_bar
    params:
      x_axis: role
      metrics:
        - {expressionType: SQL, sqlExpression: COUNT(*), label: quarantined}
      groupby: [cause]
      stack: true
      adhoc_filters:
        - {expressionType: SIMPLE, clause: WHERE, subject: at, operator: TEMPORAL_RANGE, comparator: Last 2 weeks}

  - name: Quarantines by repository and cause, last 14 days
    dataset: crew_quarantines
    viz_type: echarts_timeseries_bar
    params:
      x_axis: repo
      metrics:
        - {expressionType: SQL, sqlExpression: COUNT(*), label: quarantined}
      groupby: [cause]
      stack: true
      adhoc_filters:
        - {expressionType: SIMPLE, clause: WHERE, subject: at, operator: TEMPORAL_RANGE, comparator: Last 2 weeks}

  # Crew approval charts. crew_tasks carries one row per task, crew_reviews one row per task with
  # both reviewers' verdicts and the arbiter's side, crew_task_roles one row per task and role.
  # "Reviewer agreement" is the Coxswain dashboard's verdict chart, so this one is named Crew.
  - name: First-try approval rate by builder seat
    dataset: crew_tasks
    viz_type: echarts_timeseries_bar
    params:
      x_axis: builder_seat
      metrics:
        - {expressionType: SQL, sqlExpression: "AVG(CAST(first_try AS INTEGER))", label: first_try_rate}

  - name: Build attempts per approved task by builder seat
    dataset: crew_tasks
    viz_type: echarts_timeseries_bar
    params:
      x_axis: builder_seat
      metrics:
        - {expressionType: SQL, sqlExpression: "AVG(build_attempts)", label: attempts_per_approved}
      adhoc_filters:
        - {expressionType: SIMPLE, clause: WHERE, subject: approved, operator: "==", comparator: true}

  - name: Crew reviewer verdict mix
    dataset: crew_reviews
    viz_type: echarts_timeseries_bar
    params:
      x_axis: charter_verdict
      metrics:
        - {expressionType: SQL, sqlExpression: "COUNT(*)", label: tasks}
      groupby: [adversary_verdict]
      stack: true

  - name: Arbiter sides with the adversary
    dataset: crew_reviews
    viz_type: echarts_timeseries_bar
    params:
      x_axis: arbiter_side
      metrics:
        - {expressionType: SQL, sqlExpression: "COUNT(*)", label: tasks}
      adhoc_filters:
        - {expressionType: SIMPLE, clause: WHERE, subject: arbiter_side, operator: "!=", comparator: not needed}

  - name: Cost per approved task per role
    dataset: crew_task_roles
    viz_type: echarts_timeseries_bar
    params:
      x_axis: role
      metrics:
        - {expressionType: SQL, sqlExpression: "SUM(CASE WHEN approved THEN cost_usd ELSE 0 END) / NULLIF(COUNT(DISTINCT CASE WHEN approved THEN task_id END), 0)", label: cost_per_approved}
