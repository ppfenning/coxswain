# Charts. `params` is Superset's form data without the datasource, which bootstrap adds.
charts:
  - name: Cost per day by model alias
    dataset: calls
    viz_type: echarts_timeseries_bar
    params:
      x_axis: at
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SIMPLE, column: {column_name: cost_usd}, aggregate: SUM, label: cost_usd}
      groupby: [model_alias]
      stack: true

  - name: Cost by role, last 7 days
    dataset: calls
    viz_type: echarts_timeseries_bar
    params:
      x_axis: role
      metrics:
        - {expressionType: SIMPLE, column: {column_name: cost_usd}, aggregate: SUM, label: cost_usd}
      adhoc_filters:
        - {expressionType: SIMPLE, clause: WHERE, subject: at, operator: TEMPORAL_RANGE, comparator: Last week}

  - name: Busy lanes per hour
    dataset: lanes_by_hour
    viz_type: echarts_timeseries_line
    params:
      x_axis: hour_start
      time_grain_sqla: PT1H
      metrics:
        - {expressionType: SIMPLE, column: {column_name: busy_lanes}, aggregate: MAX, label: busy_lanes}

  - name: Runs per day
    dataset: runs
    viz_type: echarts_timeseries_bar
    params:
      x_axis: launched_at
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SQL, sqlExpression: COUNT(*), label: runs}

  # An attempt is a quarantine when its kind is one of counts_kinds. The four kinds
  # are the ones the 0.6.0 release notes name. unknown: whether attempts.kind spells
  # them the same way; check the table before trusting this chart.
  - name: Quarantined attempts per day
    dataset: attempts
    viz_type: echarts_timeseries_bar
    counts_kinds: &quarantine_kinds [refused, unverified, infra, dropped]
    params:
      x_axis: at
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SQL, sqlExpression: COUNT(*), label: quarantined}
      adhoc_filters:
        - {expressionType: SIMPLE, clause: WHERE, subject: kind, operator: IN, comparator: *quarantine_kinds}

  # unknown: whether attempts has a cause column; check the table before trusting this chart.
  - name: Quarantines by cause, last 14 days
    dataset: attempts
    viz_type: echarts_timeseries_bar
    params:
      x_axis: cause
      metrics:
        - {expressionType: SQL, sqlExpression: COUNT(*), label: quarantined}
      adhoc_filters:
        - {expressionType: SIMPLE, clause: WHERE, subject: kind, operator: IN, comparator: *quarantine_kinds}
        - {expressionType: SIMPLE, clause: WHERE, subject: at, operator: TEMPORAL_RANGE, comparator: Last 2 weeks}

  - name: Tool uses by name, top 15
    dataset: traces
    viz_type: echarts_timeseries_bar
    params:
      x_axis: tool_name
      metrics:
        - {expressionType: SQL, sqlExpression: COUNT(*), label: tool_uses}
      x_axis_sort: tool_uses
      x_axis_sort_asc: false
      row_limit: 15

  # Efficiency. Cost per turn and cost per landed divide summed parts. Cache-read share has no
  # token parts in calls_by_day, so above a one-day grain it is a turn-weighted mean of daily shares.
  - name: Cost per turn by model, by day
    dataset: calls_by_day
    viz_type: echarts_timeseries_line
    params:
      x_axis: day
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SQL, sqlExpression: "SUM(cost_usd) / NULLIF(SUM(turns), 0)", label: cost_per_turn}
      groupby: [model_alias]

  - name: Cache-read share by model, by day
    dataset: calls_by_day
    viz_type: echarts_timeseries_line
    params:
      x_axis: day
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SQL, sqlExpression: "SUM(cache_read_share * turns) / NULLIF(SUM(turns), 0)", label: cache_read_share}
      groupby: [model_alias]

  - name: Cost per landed task, by day
    dataset: daily_efficiency
    viz_type: echarts_timeseries_bar
    params:
      x_axis: day
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SQL, sqlExpression: "SUM(cost_usd) / NULLIF(SUM(landed), 0)", label: cost_per_landed}

  - name: Landed tasks per day
    dataset: daily_efficiency
    viz_type: echarts_timeseries_bar
    params:
      x_axis: day
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SQL, sqlExpression: "SUM(landed)", label: landed}

  - name: First-try build rate, by day
    dataset: landed_tasks
    viz_type: echarts_timeseries_line
    params:
      x_axis: day
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SQL, sqlExpression: "AVG(CAST(first_try AS INTEGER))", label: first_try_rate}

  - name: Lead time, launch to land (median hours), by day
    dataset: landed_tasks
    viz_type: echarts_timeseries_line
    params:
      x_axis: day
      time_grain_sqla: P1D
      metrics:
        - {expressionType: SQL, sqlExpression: "MEDIAN(lead_hours)", label: lead_hours}

  # The dataset's day is a DATE, so the temporal filter reads last_call.
  - name: Spend by task outcome, last 14 days
    dataset: task_outcomes
    viz_type: echarts_timeseries_bar
    params:
      x_axis: outcome
      metrics:
        - {expressionType: SQL, sqlExpression: "SUM(cost_usd)", label: cost_usd}
      adhoc_filters:
        - {expressionType: SIMPLE, clause: WHERE, subject: last_call, operator: TEMPORAL_RANGE, comparator: Last 2 weeks}

  - name: Reviewer agreement
    dataset: task_verdicts
    viz_type: echarts_timeseries_bar
    params:
      x_axis: charter_verdict
      metrics:
        - {expressionType: SQL, sqlExpression: "COUNT(*)", label: tasks}
      groupby: [adversary_verdict]
      stack: true

  - name: Arbiter decisions
    dataset: task_verdicts
    viz_type: echarts_timeseries_bar
    params:
      x_axis: arbiter_verdict
      metrics:
        - {expressionType: SQL, sqlExpression: "COUNT(*)", label: tasks}

  - name: Build attempts per task
    dataset: task_verdicts
    viz_type: echarts_timeseries_bar
    params:
      x_axis: build_attempts
      metrics:
        - {expressionType: SQL, sqlExpression: "COUNT(*)", label: tasks}
