<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 32" shape-rendering="crispEdges">
  <!-- Coxswain header sprite: top-down view, one stroke cycle, 6 frames of -->
  <!-- 240x32, laid out left to right. Hull spans x 22-218, currentColor over -->
  <!-- a one-pixel outline in #0b1622 (palette.css's slate cox color -->
  <!-- background, used literally since currentColor is already the hull), -->
  <!-- stepped to follow the tapered bow and stern. Rower heads are a fixed -->
  <!-- tint #a8dad5; oars are #e9c46a, wake is #4a90d9/#bfe0fb and the cox is -->
  <!-- #e63946 with a darker #8c1e29 head; all stay fixed regardless of -->
  <!-- scheme. Eight rowers sit on the deck, alternating port (near the top -->
  <!-- edge) and starboard (near the bottom edge); each oar reaches out of -->
  <!-- the hull, shaft and blade moving together, and sweeps catch, drive, -->
  <!-- finish, then recovery (blade one pixel thinner, feathered) across the -->
  <!-- six frames. The cox sits on the stern deck, topmost, facing the crew, -->
  <!-- and does not move. The wake trailing the stern shifts one pixel left -->
  <!-- each frame. -->

  <defs>
    <g id="hull">
      <rect class="hull-outline-stern-tip" x="21" y="14" width="6" height="4" fill="#0b1622"/>
      <rect class="hull-outline-stern" x="25" y="13" width="10" height="6" fill="#0b1622"/>
      <rect class="hull-outline" x="33" y="12" width="172" height="8" fill="#0b1622"/>
      <rect class="hull-outline-bow" x="203" y="13" width="12" height="6" fill="#0b1622"/>
      <rect class="hull-outline-bow-tip" x="213" y="14" width="6" height="4" fill="#0b1622"/>
      <rect class="hull-stern-tip" x="22" y="15" width="4" height="2" fill="currentColor"/>
      <rect class="hull-stern" x="26" y="14" width="8" height="4" fill="currentColor"/>
      <rect class="hull" x="34" y="13" width="170" height="6" fill="currentColor"/>
      <rect class="hull-bow" x="204" y="14" width="10" height="4" fill="currentColor"/>
      <rect class="hull-bow-tip" x="214" y="15" width="4" height="2" fill="currentColor"/>
    </g>
    <g id="rower">
      <rect width="2" height="2" fill="#a8dad5"/>
    </g>
    <g id="crew">
      <use href="#rower" x="42" y="13"/>
      <use href="#rower" x="64" y="17"/>
      <use href="#rower" x="86" y="13"/>
      <use href="#rower" x="108" y="17"/>
      <use href="#rower" x="130" y="13"/>
      <use href="#rower" x="152" y="17"/>
      <use href="#rower" x="174" y="13"/>
      <use href="#rower" x="196" y="17"/>
    </g>
    <g id="cox">
      <rect class="coxswain-body" x="27" y="14" width="3" height="3" fill="#e63946"/>
      <rect class="coxswain-head" x="30" y="15" width="2" height="2" fill="#8c1e29"/>
    </g>
  </defs>

  <!-- Frame 1: catch — oars angled toward the bow, blades entering the water. -->
  <g id="frame-1" transform="translate(0,0)">
    <rect class="wake-outer" x="12" y="15" width="4" height="2" fill="#4a90d9"/>
    <rect class="wake-inner" x="16" y="15" width="2" height="2" fill="#bfe0fb"/>
    <use href="#hull"/>
    <rect class="ripple" x="205" y="12" width="3" height="1" fill="#bfe0fb"/>
    <rect class="oar-shaft" x="45" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="45" y="4" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="89" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="89" y="4" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="133" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="133" y="4" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="177" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="177" y="4" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="67" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="67" y="25" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="111" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="111" y="25" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="155" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="155" y="25" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="199" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="199" y="25" width="2" height="3" fill="#e9c46a"/>
    <use href="#crew"/>
    <use href="#cox"/>
  </g>

  <!-- Frame 2: drive-early — oars sweeping toward square, blades buried. -->
  <g id="frame-2" transform="translate(240,0)">
    <rect class="wake-outer" x="11" y="15" width="4" height="2" fill="#4a90d9"/>
    <rect class="wake-inner" x="15" y="15" width="2" height="2" fill="#bfe0fb"/>
    <use href="#hull"/>
    <rect class="ripple" x="205" y="12" width="3" height="1" fill="#bfe0fb"/>
    <rect class="oar-shaft" x="43" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="43" y="4" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="87" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="87" y="4" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="131" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="131" y="4" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="175" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="175" y="4" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="65" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="65" y="25" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="109" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="109" y="25" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="153" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="153" y="25" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="197" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="197" y="25" width="2" height="3" fill="#e9c46a"/>
    <use href="#crew"/>
    <use href="#cox"/>
  </g>

  <!-- Frame 3: drive — oars square to the hull, mid-stroke. -->
  <g id="frame-3" transform="translate(480,0)">
    <rect class="wake-outer" x="10" y="15" width="4" height="2" fill="#4a90d9"/>
    <rect class="wake-inner" x="14" y="15" width="2" height="2" fill="#bfe0fb"/>
    <use href="#hull"/>
    <rect class="ripple" x="205" y="12" width="3" height="1" fill="#bfe0fb"/>
    <rect class="oar-shaft" x="42" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="42" y="4" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="86" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="86" y="4" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="130" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="130" y="4" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="174" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="174" y="4" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="64" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="64" y="25" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="108" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="108" y="25" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="152" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="152" y="25" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="196" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="196" y="25" width="2" height="3" fill="#e9c46a"/>
    <use href="#crew"/>
    <use href="#cox"/>
  </g>

  <!-- Frame 4: finish — oars angled toward the stern, blades lifting clear. -->
  <g id="frame-4" transform="translate(720,0)">
    <rect class="wake-outer" x="9" y="15" width="4" height="2" fill="#4a90d9"/>
    <rect class="wake-inner" x="13" y="15" width="2" height="2" fill="#bfe0fb"/>
    <use href="#hull"/>
    <rect class="ripple" x="205" y="12" width="3" height="1" fill="#bfe0fb"/>
    <rect class="oar-shaft" x="39" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="39" y="4" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="83" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="83" y="4" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="127" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="127" y="4" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="171" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="171" y="4" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="61" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="61" y="25" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="105" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="105" y="25" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="149" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="149" y="25" width="2" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="193" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="193" y="25" width="2" height="3" fill="#e9c46a"/>
    <use href="#crew"/>
    <use href="#cox"/>
  </g>

  <!-- Frame 5: recovery-early — oars feathered, thinner, swinging forward. -->
  <g id="frame-5" transform="translate(960,0)">
    <rect class="wake-outer" x="8" y="15" width="4" height="2" fill="#4a90d9"/>
    <rect class="wake-inner" x="12" y="15" width="2" height="2" fill="#bfe0fb"/>
    <use href="#hull"/>
    <rect class="ripple" x="205" y="12" width="3" height="1" fill="#bfe0fb"/>
    <rect class="oar-shaft" x="41" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="41" y="4" width="1" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="85" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="85" y="4" width="1" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="129" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="129" y="4" width="1" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="173" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="173" y="4" width="1" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="63" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="63" y="25" width="1" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="107" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="107" y="25" width="1" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="151" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="151" y="25" width="1" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="195" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="195" y="25" width="1" height="3" fill="#e9c46a"/>
    <use href="#crew"/>
    <use href="#cox"/>
  </g>

  <!-- Frame 6: recovery-late — oars feathered, nearing the next catch. -->
  <g id="frame-6" transform="translate(1200,0)">
    <rect class="wake-outer" x="7" y="15" width="4" height="2" fill="#4a90d9"/>
    <rect class="wake-inner" x="11" y="15" width="2" height="2" fill="#bfe0fb"/>
    <use href="#hull"/>
    <rect class="ripple" x="205" y="12" width="3" height="1" fill="#bfe0fb"/>
    <rect class="oar-shaft" x="44" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="44" y="4" width="1" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="88" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="88" y="4" width="1" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="132" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="132" y="4" width="1" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="176" y="7" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="176" y="4" width="1" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="66" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="66" y="25" width="1" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="110" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="110" y="25" width="1" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="154" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="154" y="25" width="1" height="3" fill="#e9c46a"/>
    <rect class="oar-shaft" x="198" y="20" width="1" height="5" fill="#e9c46a"/>
    <rect class="oar-blade" x="198" y="25" width="1" height="3" fill="#e9c46a"/>
    <use href="#crew"/>
    <use href="#cox"/>
  </g>
</svg>
