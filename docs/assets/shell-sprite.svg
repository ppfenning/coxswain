<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 24" shape-rendering="crispEdges">
  <!-- Coxswain header sprite: one stroke cycle, 4 frames of 160x24, laid out left to right. -->
  <!-- Palette: hull #6b4423, oars #d9a441, water #4a90d9, coxswain accent #e63946. -->
  <!-- Each frame: hull spans x 20-140, bow at the right (direction of travel), stern at the left. -->
  <!-- The coxswain sits in the stern (x 20-30, inside the hull) and faces right, toward the crew. -->
  <!-- The oars are drawn as one rect: in unison, port and starboard coincide in this side view. -->

  <!-- Frame 1: catch — oar forward near the bow, blade at the waterline. -->
  <g id="frame-1" transform="translate(0,0)">
    <rect class="water" x="0" y="18" width="160" height="6" fill="#4a90d9"/>
    <rect class="hull" x="20" y="12" width="120" height="6" fill="#6b4423"/>
    <rect class="oars" x="108" y="18" width="24" height="1" fill="#d9a441"/>
    <rect class="coxswain-body" x="20" y="8" width="6" height="8" fill="#e63946"/>
    <rect class="coxswain-head" x="25" y="4" width="5" height="4" fill="#e63946"/>
  </g>

  <!-- Frame 2: drive — oar pulling through, blade buried, coxswain calling the stroke (mouth open). -->
  <g id="frame-2" transform="translate(160,0)">
    <rect class="water" x="0" y="18" width="160" height="6" fill="#4a90d9"/>
    <rect class="hull" x="20" y="12" width="120" height="6" fill="#6b4423"/>
    <rect class="oars" x="64" y="19" width="24" height="2" fill="#d9a441"/>
    <rect class="coxswain-body" x="20" y="8" width="6" height="8" fill="#e63946"/>
    <rect class="coxswain-head" x="25" y="4" width="5" height="4" fill="#e63946"/>
    <rect class="coxswain-mouth" x="28" y="6" width="1" height="1" fill="#6b4423"/>
  </g>

  <!-- Frame 3: finish — oar aft, near the stern side, blade lifting clear at the waterline. -->
  <g id="frame-3" transform="translate(320,0)">
    <rect class="water" x="0" y="18" width="160" height="6" fill="#4a90d9"/>
    <rect class="hull" x="20" y="12" width="120" height="6" fill="#6b4423"/>
    <rect class="oars" x="40" y="18" width="24" height="1" fill="#d9a441"/>
    <rect class="coxswain-body" x="20" y="8" width="6" height="8" fill="#e63946"/>
    <rect class="coxswain-head" x="25" y="4" width="5" height="4" fill="#e63946"/>
  </g>

  <!-- Frame 4: recovery — oar feathered, swinging forward above the hull, clear of the water. -->
  <g id="frame-4" transform="translate(480,0)">
    <rect class="water" x="0" y="18" width="160" height="6" fill="#4a90d9"/>
    <rect class="hull" x="20" y="12" width="120" height="6" fill="#6b4423"/>
    <rect class="oars" x="76" y="9" width="24" height="1" fill="#d9a441"/>
    <rect class="coxswain-body" x="20" y="8" width="6" height="8" fill="#e63946"/>
    <rect class="coxswain-head" x="25" y="4" width="5" height="4" fill="#e63946"/>
  </g>
</svg>
