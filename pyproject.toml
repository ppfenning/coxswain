[project]
name = "coxswain"
version = "0.1.0b1"
description = "Coxswain: the agent platform. The command is `cox`, from the coxswain-tools package."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "mkdocs-material>=9.5", "mike>=2.1", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coxswain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
