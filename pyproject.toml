[project]
name = "coxswain"
version = "2026.10.3"
description = "Coxswain: the agent platform. One package, one command: `cox`."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = ["pyyaml>=6", "zstandard>=0.23"]

[project.optional-dependencies]
traces = ["zstandard>=0.23", "pyarrow>=15"]
postgres = ["psycopg[binary]>=3.2"]
parquet = ["pyarrow"]
lake = ["pyiceberg[sql-sqlite,sql-postgres,pyiceberg-core]>=0.9", "duckdb>=1.0"]
analytics = ["duckdb>=1.0"]
live = ["anthropic>=0.40"]

[project.scripts]
cox = "agent_tools.cli:main"
agent-tools = "agent_tools.cli:main"
cartridge = "core.cartridge:_main"

[project.urls]
Repository = "https://github.com/ppfenning/coxswain"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.6",
    "ruff==0.16.6",
    "mkdocs-material>=9.5",
    "mike>=2.1",
    "rich>=13",
    "duckdb>=1.1",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# One distribution, several import packages, each in the folder its history lives in:
# src/tools (agent_tools), src/graphs (harness, runner, graphs), src/cartridges (core), and the umbrella's coxswain/.
[tool.setuptools]
packages = [
    "coxswain",
    "agent_tools", "agent_tools.settings_sections",
    "harness", "runner",
    "graphs", "graphs.delivery", "graphs.ops",
    "core",
    "providers",
]

[tool.setuptools.package-dir]
agent_tools = "src/tools/agent_tools"
harness = "src/graphs/harness"
runner = "src/graphs/runner"
graphs = "src/graphs/graphs"
core = "src/cartridges/core"
providers = "src/cartridges/providers"

# The model freshness check reads providers/catalog.yaml beside the core package, so it ships at the wheel root.
[tool.setuptools.package-data]
agent_tools = ["extras-requirements.txt"]
providers = ["catalog.yaml"]

[tool.pytest.ini_options]
# The umbrella's own tests. src/tools, src/graphs and src/cartridges each run their suite from their folder,
# under their own pytest.ini, because their tests import sibling test modules by name.
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
src = [".", "src/tools", "src/graphs", "src/cartridges"]
# Operator decision, 2026-09-05: "ruff over the repos in CI or pre-commit". The set leans on the
# charter (pure core, no rebinding, no side doors): E/F correctness, I imports,
# UP modern syntax, B bugbear, SIM, RET, C4, DTZ clocks, RUF. Ignored on purpose:
# E501/E701/E702 (the codebase uses dense one-liners at the edge), E741 (single
# letters in short comprehensions), PLW1510 (edges read subprocess returncodes
# deliberately), RUF005/RUF043/RUF059/B905/ISC004 (style calls, not defects).

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "DTZ", "ISC", "RET", "C4", "PLW"]
ignore = ["E501", "E701", "E702", "E741", "PLW1510", "RUF005", "RUF043", "RUF059", "B905", "ISC004"]
