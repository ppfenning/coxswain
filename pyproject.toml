[project]
name = "coxswain-umbrella"
version = "0.0.0"
description = "Coxswain: docs, manifest and installer for the agent platform (beta). Not a package; the `cox` command ships in coxswain-tools."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "mkdocs-material>=9.5", "mike>=2.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
