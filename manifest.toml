# What a Coxswain release is, beyond the checkout it ships in.
#
# One repository (ppfenning/coxswain), one distribution (`coxswain`, the `cox` command), one
# version: CalVer YYYY.M.N, tagged vYYYY.M.N. The checkout IS the release, so tools, graphs,
# cartridges and crew are folders here (src/tools, src/graphs, src/cartridges, crew), never
# pinned. `python -m devtools release <version>` bumps `[coxswain] version` and the root
# pyproject.toml together.
#
# Shape (readers: devtools/, docs/_pull.py, src/tools/agent_tools/install.py):
#   [coxswain]   version = "YYYY.M.N"; status = "beta" | "stable"
#   [components] only what lives in another repository, opted into by a flag. Each entry:
#                repo = "org/name", tag = "vX" (the release channel) or ref = "main" (edge),
#                never both; flag = the `--with` name; provides = the command it installs;
#                since = the release it joined; docs = paths the docs site pulls from it.
#                A release tags it only when it has commits since its tag; else it keeps its tag.
#   [providers]  name = { status = "supported" | "experimental" | "planned", profile = path
#                under src/cartridges/ } for the provider profiles a host may pick.

[coxswain]
version = "2026.10.2"
status  = "beta"

[components]
dash = { repo = "ppfenning/coxswain-dash", tag = "v2026.10.2", flag = "dash", provides = "towpath", since = "0.26.0", docs = ["README.md"] }

[providers]
claude-code = { status = "supported", profile = "providers/claude-code.yaml" }
codex       = { status = "planned" }
gemini      = { status = "planned" }
local       = { status = "experimental", profile = "providers/local-oss.yaml" }
