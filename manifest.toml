# The single source of truth for what a Coxswain release installs.
# Every component is tagged v<coxswain.version> at release, in lockstep.
# Repository names are the post-rename names (design §1a); until the rename
# lands, `cox install` follows GitHub's redirects from the agent-* names.

[coxswain]
version = "0.1.0-beta.1"
status  = "beta"

[components]
cartridges = { repo = "ppfenning/coxswain-cartridges", tag = "v0.1.0-beta.1", required = true, docs = ["README.md"] }
graphs     = { repo = "ppfenning/coxswain-graphs",     tag = "v0.1.0-beta.1", required = true, docs = [
    "README.md",
    "graphs/delivery/epic-swarm.md",
    "graphs/delivery/lifecycle-propose.md",
    "graphs/delivery/initiative-decompose.md",
    "graphs/ops/coxswain.md",
    "graphs/ops/epic-reconcile.md",
    "graphs/ops/retro-propose.md",
    "graphs/ops/triage-propose.md",
    "docs/GRAPH-CONTRACT.md",
    "docs/RUNBOOK-TRUST.md",
    "docs/graphs/*.md",
] }
tools      = { repo = "ppfenning/coxswain-tools",      tag = "v0.1.0-beta.1", required = true, provides = "cox", docs = ["README.md"] }
crew       = { repo = "ppfenning/coxswain-crew",       tag = "v0.1.0-beta.1", flag = "crew", docs = ["README.md"] }

[providers]
claude-code = { status = "supported", profile = "providers/claude-code.yaml" }
codex       = { status = "planned" }
gemini      = { status = "planned" }
local       = { status = "planned" }
