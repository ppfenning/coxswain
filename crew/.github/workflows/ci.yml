name: ci
on: [push, pull_request]
jobs:
  seats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every seat is well formed
        run: python3 .github/check_seats.py
      - name: nothing names an employer
        run: python3 .github/check_clean.py
      - name: install.sh is sound
        run: bash -n install.sh && ./install.sh --prefix "$RUNNER_TEMP/agents" && ./install.sh --check --prefix "$RUNNER_TEMP/agents"
