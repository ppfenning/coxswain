[pytest]
# This suite runs from its own folder (cd src/cartridges && pytest); its tests import siblings by module name.
# The sibling source roots follow it, so a worktree's change in one folder is what another folder's tests import.
testpaths = tests
# A run outside a lane scratch directory keeps only the temp directory of a failed test.
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
pythonpath = . ../tools ../graphs
