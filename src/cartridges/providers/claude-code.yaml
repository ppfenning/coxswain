# Provider profile — headless Claude Code as the runner.
#
# Same vendor axis as anthropic-default.yaml, different execution: every node
# is a `claude -p` session on the local login, so there is no API key and the
# subscription pays. Tiers name Claude Code's model aliases, which track the
# current model of each class; pin a full model id here to stop that.
#
# This profile also grants TOOLS per role, which the API runner cannot. The
# rule that decides the table below: roles that read the world get a read-only
# view of the repository; the apply arms — and only they — may write, and only
# into the work store under the runner's working directory. The harness still
# applies every diff itself, in a worktree it owns. A role not listed runs
# with no tools at all, which is the API runner's contract exactly.
#
# Changing anything here resets autonomy streaks (see base policy): a track
# record earned on one runner is not a track record on another.
profile: claude-code
description: Headless Claude Code (`claude -p`) on the local login; per-role tool grants
runner: claude-code
command: claude            # the binary; must be on PATH and logged in

tiers:
  cheap:     haiku          # bulk classification, enumeration
  standard:  sonnet         # most nodes
  deep:      opus           # verification, adversarial review, arbitration

# Effort per tier. Deep stays high, not xhigh: the verifier seats keep the
# strongest model, and the extra thinking budget above `high` was the one
# cost lever with no measured quality return on a review of a small diff.
effort:
  cheap:     low
  standard:  high
  deep:      high

# Dollar ceilings per node session, by tier, with per-role exceptions. Measured
# on the run that prompted this: builds ran 79–101 turns at $1.1–$1.8 each and
# failed anyway; a plan node that finishes cheaply does so in ~10 turns for
# under $0.10. The ceiling turns an unbounded session into a quarantined task
# with a named reason (`error_max_budget_usd`).
budget_usd:
  cheap:     0.10
  standard:  0.35
  deep:      0.80
role_budget_usd:
  build:     0.60          # it edits, tests and diffs; it still does not get to wander

# Roles a graph asks "standard" for that are extraction, not judgment. The
# profile may run them cheap; changing this resets streaks like any profile edit.
tier_overrides:
  scope_epic: cheap

defaults:
  plan:            standard
  build:           standard
  review_charter:  deep
  review_adversary: deep
  arbitrate:       deep
  triage_classify: cheap
  evidence_verify: deep

tools:
  # Read the world, change nothing.
  decompose:        [Read, Grep, Glob]
  scope_epic:       [Read, Grep, Glob]
  plan:             [Read, Grep, Glob]
  review_charter:   [Read, Grep, Glob]
  review_adversary: [Read, Grep, Glob]
  arbitrate:        [Read, Grep, Glob]
  evidence_verify:  [Read, Grep, Glob]
  reconcile:        [Read, Grep, Glob]
  retro:            [Read, Grep, Glob]
  # The builder is the one role that WRITES to produce its answer. It gets a
  # disposable scratch worktree from the runner, edits real files there, runs
  # the project's real commands, and returns the diff git computed. Nothing it
  # writes survives the call; the harness still applies the patch itself.
  build:            [Read, Write, Edit, Grep, Glob, Bash]

  # NOT handoff, validate_chunk or validate_phase. Those judge the artifact
  # they are handed — a patch, a task record — against what the next step
  # needs, and a patch is never applied in the checkout they could read. The
  # first live epic gave them a view of the tree and they correctly reported
  # that nothing had changed in it, quarantining every task. Blind is right.
  # The arms. Write into the work store; nowhere else.
  work_item_arm:    [Read, Write, Edit, Glob, Grep]
  work_state_arm:   [Read, Edit, Glob, Grep]
  docs_apply_arm:   [Read, Write, Edit, Glob, Grep]
