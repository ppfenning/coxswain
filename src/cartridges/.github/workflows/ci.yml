name: ci

# This repo is private, so Actions minutes are billable. Docs-only pushes to
# main skip a run, a superseded run is cancelled rather than finishing, and pip
# is cached. Pull requests always run: the branch-protection ruleset requires
# the `test` check before a merge, and a markdown-only PR with no check can
# never merge without an administrator override.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.gitignore', 'LICENSE']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
