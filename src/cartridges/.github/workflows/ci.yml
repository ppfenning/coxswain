name: ci

# This repo is private, so Actions minutes are billable. Docs-only pushes do not
# trigger a run, a superseded run is cancelled rather than finishing, and pip is
# cached. The suite takes about a fifth of a second — the runner startup and the
# install were the entire cost.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.gitignore', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', '.gitignore', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
