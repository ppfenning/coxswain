[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cartridges"
version = "0.1.0"
description = "A portable substrate for running agent graphs against your team's rules"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cartridge = "core.cartridge:_main"

[tool.setuptools]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite imports helpers from tests/conftest.py by name, which needs the repo
# root importable. `python -m pytest` adds the cwd for you and bare `pytest` does
# not, so without this the suite passes locally and fails in CI — which is
# exactly what happened.
pythonpath = ["."]
