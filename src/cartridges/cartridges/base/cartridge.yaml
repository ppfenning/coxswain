# Base cartridge — the layer every team cartridge extends.
#
# Holds what is true regardless of team, tracker, or domain: the node-role
# contract, the write-kind taxonomy with its risk and ramp defaults, the
# routing model, the epic threshold, and the autonomy policy.
#
# Teams do NOT edit this file. A team cartridge declares `extends: base` and
# supplies its own bindings — which skill fills each role, where writes land,
# what its code-style charter says. Merge is a deep-merge with child-wins;
# `context` lists concatenate base-first so a team pack refines rather than
# replaces a base principle.
#
# A team may TIGHTEN a risk or ramp. A team may never loosen one.
team: base
description: General base layer — extended by team cartridges
version: 1

# ── Node roles (the contract between graphs and cartridges) ──────────────────
# Graphs reference ROLES, never skills. This is the seam that makes a graph
# portable: the same graph runs for any team that can bind its required roles.
roles:
  required:
    - plan              # decompose a work item into an ordered plan
    - build             # do the work, in an isolated workspace it owns
    - review_charter    # review against the team's own written standards
    - work_state_arm    # SINGLE WRITER of work state, wherever that lives
    - work_item_arm     # creates/updates work items
  optional:
    - decompose         # a large idea -> phases -> tasks, with dependency edges
    - scope_epic        # one item -> epic / parent+subtasks / single item
    - handoff           # validate that step N's output satisfies step N+1's needs
    - triage_classify   # symptom -> known-pattern key
    - runbook_execute   # follow a written operational procedure
    - evidence_verify   # deterministic checks that a claim is actually true
    - review_adversary  # second reviewer whose job is to disagree
    - arbitrate         # resolve reviewer disagreement
    # Competition before build (lifecycle-propose). A plan costs a tenth of a
    # build, so alternatives are compared here, never as two diffs.
    - plan_alternative  # a second, independent plan, told to differ from the first
    - plan_arbitrate    # choose between two plans, or merge them, and name the price
    - plan_adversary    # attack the chosen plan's claims before anyone builds it
    - reconcile         # compare declared state vs actual state
    - docs_apply_arm    # writes to the knowledge base
    - fleet_sweep       # same check across many targets
    - discipline        # budget/token/scope guardrails
    - validate_chunk    # did this task actually satisfy its own description
    - validate_phase    # do these tasks TOGETHER accomplish the phase's goal —
                        # never the phase's owner: that is self-review
    - retro             # read the run record and say what should change
    - dispatch          # pick which graphs to run next, and why
    - route             # decide if a request is harness work, size it, launch it, report on it

# ── The crew (optional): seats -> the skills they route to ──────────────────
# A SEAT is a standing agent role — its surface, write authority, tiering rule
# and brief discipline — defined outside any team, in `agent-cast`. A seat
# names what it does; a cartridge says which of THIS team's skills fill it.
#
# The same seam as `skills` above, one layer up: `skills` binds the roles a
# GRAPH's nodes ask for, `crew` binds the roles a PERSON delegates to. A team
# that binds neither still runs; a seat with no binding simply routes to
# nothing team-specific.
#
#   crew:
#     nova:   {skills: [...], context: "one line on what this team means by it"}
#     sarah:  {skills: [...]}
#
# `cast` is accepted as a deprecated alias for `crew` this release; a layer
# that uses it is named in the resolved cartridge's `deprecations` list.
#
# Base binds nothing: it has no skills of its own to bind.
crew: {}

# ── Where work lands, by state ──────────────────────────────────────────────
# Not every item belongs in the active set. Route by the state of the work, not
# by who filed it. The landing names below are ABSTRACT: a team with a tracker
# binds them to boards and columns, a team without one binds them to
# directories. Neither is named here.
work_routing:
  states:
    active:  active_work     # being worked now
    planned: planned_work    # scoped and scheduled
    future:  future_work     # roadmapped for later -> NOT the active set
  rules:
    - future work attaches to its parent epic when one exists
    - future work never enters the active set; it graduates at scoping
    - teams bind the landing for each state in their own landing_areas

# ── When something deserves to be an epic ───────────────────────────────────
# Most work does not. Epic iff ANY of:
epic_threshold:
  phases_min: 2      # genuinely multi-phase
  tickets_min: 3     # 3+ tickets even if single-phase
  multi_repo: true   # coordinated change across repositories
# Below threshold: one unit of work -> one ticket. Two related but unordered
# units -> a parent ticket with subtasks. Attach to an existing epic if one
# covers the area; otherwise route per ticket_routing.

# ── Write-kind taxonomy ─────────────────────────────────────────────────────
# Every write an agent can propose is a named KIND with a risk and a ramp.
# Policy keys on (kind, risk) — never on who is running the graph.
#
#   ramp: eligible  may earn autonomy through a clean streak
#         gated     always requires a human decision
#         deferred  eligible, but not until the basics are trusted
#         never     a human does this, permanently
write_kinds:
  comment_add:        {risk: low,    ramp: gated}
  item_create:        {risk: low,    ramp: deferred}
  item_update:        {risk: low,    ramp: deferred}
  state_move:         {risk: low,    ramp: deferred}
  doc_update:         {risk: low,    ramp: deferred}
  draft_pr_create:    {risk: low,    ramp: eligible}   # draft only — no effect until opened
  retry_idempotent:   {risk: medium, ramp: eligible}   # safe to run twice
  pr_ready_flip:      {risk: medium, ramp: gated}
  state_mutation:     {risk: high,   ramp: never}      # changes production state
  destructive:        {risk: high,   ramp: never}      # deletes or overwrites

  # 2026-09-01, merge split by target. One `merge` kind priced two unlike acts
  # identically: joining a task branch to the phase branch above it, and putting
  # code on the branch everyone else builds from. Only the second one is
  # irreversible in the way that argues for a permanent human. Splitting is not
  # loosening — merge_main inherits the old kind's never-graduates posture, and
  # merge_stack is a NEW, narrower act that never had a kind of its own.
  merge_stack:        {risk: high,   ramp: eligible}   # task branch -> its parent phase branch
  merge_main:         {risk: high,   ramp: never}      # -> the default branch. a human, at every comfort level
  # A team that does not want merge_stack earnable tightens it to `gated` in its
  # own cartridge; the one-way tighten rule is what makes that toggle legal.

  # Rewriting a branch other work is stacked on can silently drop a commit, and
  # is not obviously reversible once the stack above it has moved. Governed
  # through the ramp rather than banned outright, because the sentence worth
  # being able to say is "rebase automatically, but only once you have done
  # fifty of them cleanly".
  stack_rebase:       {risk: high,   ramp: eligible}

  # The kind the HARNESS escalates a proposal to when its diff mechanically
  # touches governance: cartridges/, skills-plugins/, core/policy.py,
  # core/ledger.py, harness/, the ledger file. A graph never emits this kind —
  # it is derived from the patch, the way change_facts are. A system must not
  # loosen its own rules on its own say-so, so this one goes out as a PR and
  # never graduates, whatever streak the underlying kind had earned.
  self_modification:  {risk: high,   ramp: never, apply_arm: pr}

  charter_proposal:   {ramp: never, apply_arm: pr}     # changes the rules themselves
  skill_proposal:     {ramp: never, apply_arm: pr}

# ── Autonomy policy ─────────────────────────────────────────────────────────
# Nothing auto-applies on day one. A kind earns autonomy by being right N times
# in a row, measured at the human gate, and loses it on a single reversal.
# Changing the cartridge or the model bindings RESETS every streak — a track
# record earned under different rules is not a track record.
policy:
  graduation_n: 5              # clean applications before a kind may auto-apply
  regraduation_multiplier: 2   # after a reversal, the bar doubles
  caps:                        # per-run ceilings even once graduated
    retry_idempotent: 3
    item_create: 10
  review_tier:
    tier0_patterns: [docs_only, rename_only, config_bump, param_tweak]
    tier0_max_changed_lines: 30    # this small, in one module, on no dangerous surface: the charter reviewer alone
    tier1_max_changed_lines: 150
    tier1_max_modules: 1
    tier2_surfaces: [schema, migration, deletion, auth, infrastructure, cross_repo, production_write_path]
  plan_competition:
    min_tier: 1                  # the alternative plan, the arbiter and the plan attacker run only when the task's
                                 # pre-build tier (surfaces and patterns; no change facts exist yet) is at least this;
                                 # 0 runs them on everything, 3 never.
  dispatch:
    max_in_flight: 3             # how many harness runs the dispatcher may have alive at once;
                                 # the docket reports what is in flight and the dispatcher fills only the free slots.
  build_budget_usd_max: 3.0     # a work item may raise its own build ceiling with `budget_usd:`;
                                 # this is the most it may ask for, and the harness refuses anything above it, quoting this number.
  budgets:
    triage_run_tokens: 200000
    build_run_tokens: 500000

context:
  - context/conventions.md
  - context/epic-model.md
