[pytest]
# This suite runs from its own folder (cd src/graphs && pytest); its tests import siblings by module name.
# The sibling source roots follow it, so a worktree's change in one folder is what another folder's tests import.
testpaths = tests
pythonpath = . ../tools ../cartridges
markers =
    serial: timing-sensitive; run alone after the xdist workers finish (see harness/serial_tests.py)
