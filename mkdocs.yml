site_name: Coxswain
site_description: The umbrella for the agent platform.

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - search.suggest
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark

extra_css:
  - assets/palette.css
  - assets/sprite.css

nav:
  - Home: index.md
  - Start here:
      - Start: start/index.md
      - The loop: start/loop.md
  - Install:
      - Install: install/index.md
      - Supported machines: install/machines.md
      - Providers: install/providers.md
  - Methodology:
      - Methodology: methodology/index.md
      - Crew and seats: methodology/crew-and-seats.md
      - Cartridges: methodology/cartridges.md
      - Graphs: methodology/graphs.md
      - Review: methodology/review.md
      - Budgets: methodology/budgets.md
      - Landing: methodology/landing.md
      - Records: methodology/records.md
  - Customize:
      - Customize: customize/index.md
      - Team cartridge: customize/team-cartridge.md
      - Fragments: customize/fragments.md
      - Skills: customize/skills.md
      - Providers: customize/providers.md
      - Policy: customize/policy.md
      - Write a skill: customize/write-a-skill.md
      - Write a graph: customize/write-a-graph.md
  - Components:
      - Components: components/index.md
      - Cartridges: components/cartridges.md
      - Graphs: components/graphs.md
      - Tools: components/tools.md
      - Crew: components/crew.md
      - HUD: components/hud.md
      - Desktop: components/desktop.md
  - Releases:
      - Releases: releases/index.md
      - 0.1.0-beta.1: releases/0.1.0-beta.1.md

extra:
  version:
    provider: mike
  status: beta
