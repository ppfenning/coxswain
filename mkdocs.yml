site_name: Coxswain
site_description: Agents pull the oars. You hold the tiller. Every stroke on the record.

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.footer
    - search.suggest
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark

extra_css:
  - assets/palette.css
  - assets/sprite.css

markdown_extensions:
  - pymdownx.snippets:
      base_path: [docs]
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
