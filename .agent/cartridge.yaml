# The self-hosted runner runs the same suites as the required test job, so a land waits on CI
# instead of running them again locally. Task checks (.agent-checks) run the same commands
# narrowed to the tests a patch can affect; the full suite runs once, in CI, on the PR
# (Pat, 2026-11-10: "only testing what is touched, then leave tests to CI for initiative level PRs").
landing_areas:
  land_checks: ci
