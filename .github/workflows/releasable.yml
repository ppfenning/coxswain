name: releasable
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: test ! -f mkdocs.yml || uv run mkdocs build --strict
      - if: failure()
        run: |
          echo "releasable: coxswain (this repo) failed" >> "$GITHUB_STEP_SUMMARY"
  components:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each component is checked the way ITS OWN ci.yml checks it. The
        # previous version assumed every component had a uv `dev` dependency
        # group and a pyproject; none did (cartridges/tools use an optional
        # `dev` extra, graphs' `shell` extra needs the private substrate, crew
        # is bash), so this job failed every night from 2026-09-09 on.
        include:
          - component: cartridges
            repo: ppfenning/coxswain-cartridges
            check: pip install -e ".[dev]" && pytest -q
          - component: graphs
            repo: ppfenning/coxswain-graphs
            # coxswain-cartridges is public: install the substrate from GitHub
            # and run the WHOLE suite, not the token-gated subset graphs' own CI
            # falls back to (two tests import `core` outside the skip guard).
            check: pip install -e ".[dev]" "git+https://github.com/ppfenning/coxswain-cartridges@main" && pytest -q
          - component: tools
            repo: ppfenning/coxswain-tools
            check: pip install -e ".[dev]" && pytest -q
          - component: crew
            repo: ppfenning/coxswain-crew
            check: python3 .github/check_seats.py && python3 .github/check_clean.py && bash -n install.sh && ./install.sh --prefix "$RUNNER_TEMP/agents" && ./install.sh --check --prefix "$RUNNER_TEMP/agents"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ${{ matrix.check }}
      - if: failure()
        run: |
          echo "releasable: ${{ matrix.component }} (${{ matrix.repo }}@main) failed" >> "$GITHUB_STEP_SUMMARY"
  summary:
    runs-on: ubuntu-latest
    if: always()
    needs: [self, components]
    steps:
      - if: needs.self.result != 'success' || needs.components.result != 'success'
        run: exit 1
