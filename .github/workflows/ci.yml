name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  # The checks run as parallel jobs; `test` is the one required check and passes only when every one of them passed.
  checks:
    runs-on: ${{ vars.COXSWAIN_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        # the unwired check diffs from the merge base with the PR's base branch, so it needs the history
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.14", enable-cache: true }
      - run: uv sync --group dev
      # H10 item 5: a public symbol the change adds under src/ with no reference outside tests fails the job
      - name: unwired (no added symbol without a caller)
        run: uv run python .github/check_unwired.py --base "origin/${{ github.base_ref || 'main' }}"
      # The main scan: every public symbol under src/ has a caller, an allowlisted entry point, or a line on the debt
      # list (.github/unwired-debt.txt), so a change that deletes a symbol's last caller fails too
      - name: unwired main scan (no symbol without a caller, an entry point or a debt line)
        run: uv run python .github/check_unwired.py --all
      - name: ruff (rules in pyproject.toml, tools adds src/tools/ruff.toml)
        run: uv run ruff check .
      # H2 (docs/hardening.md): pyright, strict on the typed core and basic elsewhere ([tool.pyright] in pyproject.toml).
      # It resolves the optional extras' imports too. REQUIRED turns a missing pyright or extra into a failure.
      - name: types (pyright)
        run: uv run --all-extras python .github/check_types.py
        env:
          COX_TYPES_REQUIRED: "1"
      # no person, host or home path ships; the names rule's regex lives only in the secret (unset on fork PRs: skipped)
      - name: clean (no personal reference)
        run: python .github/check_clean.py .
        env:
          COXSWAIN_CLEAN_DENY: ${{ secrets.COXSWAIN_CLEAN_DENY }}
      - run: uv run mkdocs build --strict

  unit:
    name: unit (${{ matrix.suite }})
    runs-on: ${{ vars.COXSWAIN_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: root, dir: . }
          - { suite: tools, dir: src/tools }
          - { suite: graphs, dir: src/graphs }
          - { suite: cartridges, dir: src/cartridges }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.14", enable-cache: true }
      - run: uv sync --group dev
      # Named `pytest <suite>`: the land's rerun rule reads the failed suite from the step name (land._suite_of).
      # The guard fails every skip that is neither marked for the extras jobs nor on ALLOWED_SKIPS
      # (src/graphs/harness/extras_tests.py), so no test drops out of both jobs.
      - name: pytest ${{ matrix.suite }}
        run: uv run pytest -q -n auto
        working-directory: ${{ matrix.dir }}
        env:
          COX_EXTRAS_GUARD: unit

  smoke:
    # The non-forge suite in parallel shards, by file (smoke/plan.py shard_files): each shard installs cox once, and
    # every collected file lands in exactly one shard. The shards are 1/n .. n/n, which tests/test_workflows.py pins.
    name: smoke (${{ matrix.shard }})
    runs-on: ${{ vars.COXSWAIN_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 1/3 }
          - { shard: 2/3 }
          - { shard: 3/3 }
    # The suite gives each test a database of its own on this Postgres (docs/smoke.md).
    services:
      postgres:
        image: postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f # smoke/plan.py POSTGRES_IMAGE; bump together
        env:
          POSTGRES_PASSWORD: smoke
        # a random host port, so two jobs can share a self-hosted runner's host
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.14", enable-cache: true }
      - run: uv sync --group dev
      # The smoke install carries the postgres and lake extras, so a dependency missing outside every extra would not
      # show there: this checkout installed bare, under a home of its own, runs `cox --help` and one real command.
      # Once, in the first shard.
      - name: bare install (no extras)
        if: matrix.shard == '1/3'
        run: |
          bare="$RUNNER_TEMP/bare"
          uv venv --quiet --python 3.14 "$bare/venv"
          uv pip install --quiet --python "$bare/venv/bin/python" .
          mkdir -p "$bare/user" "$bare/runs"
          export HOME="$bare/user" XDG_CONFIG_HOME="$bare/user/.config" XDG_DATA_HOME="$bare/user/.local/share" XDG_STATE_HOME="$bare/user/.local/state"
          "$bare/venv/bin/cox" --help >/dev/null
          "$bare/venv/bin/cox" runs series --runs-dir "$bare/runs"
      # Real `cox`, installed from this checkout, against real git and the service's Postgres; nothing is stubbed.
      # REQUIRED turns a missing uv or Postgres into a failure, not a skip.
      - name: smoke
        run: uv run pytest -q -rs -m "not forge" smoke
        env:
          COX_SMOKE_POSTGRES_URL: postgresql://postgres:smoke@localhost:${{ job.services.postgres.ports['5432'] }}/postgres
          COX_SMOKE_REQUIRED: "1"
          COX_SMOKE_SHARD: ${{ matrix.shard }}

  smoke-forge:
    name: smoke (forge)
    runs-on: ${{ vars.COXSWAIN_RUNNER || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f # smoke/plan.py POSTGRES_IMAGE; bump together
        env:
          POSTGRES_PASSWORD: smoke
        # a random host port, so two jobs can share a self-hosted runner's host
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.14", enable-cache: true }
      - run: uv sync --group dev
      # The suite's forge tests: a Forgejo container started with docker (smoke/plan.py FORGEJO_IMAGE, pinned by
      # digest), a land through it, and the edge upgrade's rollback rule on a real install (docs/smoke.md).
      - name: smoke (forge)
        run: uv run pytest -q -rs -m forge smoke
        env:
          COX_SMOKE_POSTGRES_URL: postgresql://postgres:smoke@localhost:${{ job.services.postgres.ports['5432'] }}/postgres
          COX_SMOKE_REQUIRED: "1"

  # The required check. It runs even when a job it needs failed or was cancelled, and passes only when all of them
  # succeeded: a skipped required check would otherwise count as passing.
  test:
    if: always()
    needs: [checks, unit, smoke, smoke-forge]
    runs-on: ubuntu-latest
    steps:
      - name: every check job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ needs.checks.result }}" = success
          test "${{ needs.unit.result }}" = success
          test "${{ needs.smoke.result }}" = success
          test "${{ needs.smoke-forge.result }}" = success

  py315:
    # The pre-release interpreter builds several dependencies from source (about 20 minutes), and a land waits for
    # every check on its pull request. It runs on each push to main instead, so a break still shows right after the merge.
    if: github.event_name == 'push'
    runs-on: ${{ vars.COXSWAIN_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.15", enable-cache: true }
      - run: uv sync --group dev --python 3.15
      - name: pytest root
        run: uv run pytest -q -n auto
      - name: pytest tools
        run: uv run pytest -q -n auto
        working-directory: src/tools
      - name: pytest graphs
        run: uv run pytest -q -n auto
        working-directory: src/graphs
      - name: pytest cartridges
        run: uv run pytest -q -n auto
        working-directory: src/cartridges

  extras:
    # The lake, Parquet and Postgres tests skip in `unit`, which installs no extras and names no test database.
    # This job installs them and a Postgres 16. On a pull request it runs only those tests, the ones
    # src/graphs/harness/extras_tests.py marks `extras`. On a push to main it runs each whole suite, since product code
    # also branches on whether an extra is present, so main still runs every test with every extra installed.
    # One job per suite, each with its own Postgres, so the suites run side by side.
    name: extras (${{ matrix.suite }})
    runs-on: ${{ vars.COXSWAIN_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # `selects`: which of the two marked steps has tests here. A step with none expected may exit 5 (pytest's
        # "no tests selected"); anywhere else an empty selection fails.
        include:
          - { suite: root, dir: ., selects: extras }
          - { suite: tools, dir: src/tools, selects: both }
          - { suite: graphs, dir: src/graphs, selects: both }
          - { suite: cartridges, dir: src/cartridges, selects: none }
    env:
      COX_EXTRAS_GUARD: extras  # a test this job runs must not skip, unless its reason is on ALLOWED_SKIPS
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        # a random host port, so two of these jobs can share a self-hosted runner's host
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Point the store tests at the service's host port
        run: |
          url="postgresql://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres"
          echo "COX_TEST_POSTGRES_URL=$url" >> "$GITHUB_ENV"
          echo "COXSWAIN_TEST_PG_URL=$url" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.14", enable-cache: true }
      - run: uv sync --group dev --all-extras
      # Fails here, with the import error, rather than as a pytest run that skipped them all.
      - run: uv run python -c "import psycopg, pyarrow, pyiceberg, duckdb, harness.store_migrate"
      - name: extras ${{ matrix.suite }}
        if: github.event_name != 'push'
        run: uv run pytest -q -rs -n auto -m "extras and not postgres" || { test $? -eq 5 && test "${{ matrix.selects }}" = none; }
        working-directory: ${{ matrix.dir }}
      # Serial on purpose: the Postgres store tests back the test database up with pg_dump before migrating it,
      # which fails under xdist workers.
      - name: extras ${{ matrix.suite }} (postgres)
        if: github.event_name != 'push'
        run: uv run pytest -q -rs -m postgres || { test $? -eq 5 && test "${{ matrix.selects }}" != both; }
        working-directory: ${{ matrix.dir }}
      - name: extras ${{ matrix.suite }} (whole suite)
        if: github.event_name == 'push'
        run: uv run pytest -q -rs
        working-directory: ${{ matrix.dir }}

  seats:
    runs-on: ${{ vars.COXSWAIN_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 check_seats.py
        working-directory: crew
      - name: install.sh writes and checks the seats
        working-directory: crew
        run: bash -n install.sh && ./install.sh --prefix "$RUNNER_TEMP/agents" && ./install.sh --check --prefix "$RUNNER_TEMP/agents"
