name: release-rehearsal
# Design: docs/release-rehearsal.md. Dispatched with full commit SHAs; the run title is what the release gate matches on.
# upgrade and migrate start from a real install of previous_tag (v0.47.0: the multi-repo coxswain-tools line).
run-name: >-
  rehearsal sha=${{ inputs.sha }} dash=${{ inputs.dash_sha || 'pinned' }} previous=${{ inputs.previous_tag }}
  migrations=${{ inputs.migrations || 'none' }}
on:
  workflow_dispatch:
    inputs:
      sha: { description: Full 40 character commit SHA of coxswain, type: string, required: true }
      dash_sha: { description: "Full 40 character commit SHA of coxswain-dash when the release tags it; empty keeps its pinned tag", type: string, required: false, default: "" }
      previous_tag: { description: "Last release tag, such as v0.47.0", type: string, required: true }
      migrations: { description: "Declared migration ids, comma separated; empty when none", type: string, required: false, default: "" }
permissions:
  contents: read
jobs:
  fresh:
    runs-on: ubuntu-latest
    container: debian:stable-slim
    env: &inputs
      SHA: ${{ inputs.sha }}
      DASH_SHA: ${{ inputs.dash_sha }}
      PREVIOUS_TAG: ${{ inputs.previous_tag }}
      MIGRATIONS: ${{ inputs.migrations }}
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git python3
      - uses: actions/checkout@v4
      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install node and npm
        run: apt-get install -y --no-install-recommends nodejs npm
      - name: install claude code
        run: npm install -g @anthropic-ai/claude-code
      - name: fresh
        run: >-
          python3 scripts/release_rehearsal.py --scenario fresh
          --sha "$SHA" --dash-sha "$DASH_SHA" --previous-tag "$PREVIOUS_TAG" --migrations "$MIGRATIONS"
  upgrade:
    runs-on: ubuntu-latest
    container: debian:stable-slim
    env: *inputs
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git python3
      - uses: actions/checkout@v4
      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install node and npm
        run: apt-get install -y --no-install-recommends nodejs npm
      - name: install claude code
        run: npm install -g @anthropic-ai/claude-code
      - name: upgrade
        run: >-
          python3 scripts/release_rehearsal.py --scenario upgrade
          --sha "$SHA" --dash-sha "$DASH_SHA" --previous-tag "$PREVIOUS_TAG" --migrations "$MIGRATIONS"
  migrate:
    runs-on: ubuntu-latest
    container: debian:stable-slim
    env: *inputs
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git python3
      - uses: actions/checkout@v4
      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install node and npm
        run: apt-get install -y --no-install-recommends nodejs npm
      - name: install claude code
        run: npm install -g @anthropic-ai/claude-code
      - name: migrate
        run: >-
          python3 scripts/release_rehearsal.py --scenario migrate
          --sha "$SHA" --dash-sha "$DASH_SHA" --previous-tag "$PREVIOUS_TAG" --migrations "$MIGRATIONS"
