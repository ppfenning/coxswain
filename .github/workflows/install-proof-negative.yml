name: install-proof-negative

# Standing failing case: the proof must reject a deliberately broken formula.
# A green run means the proof caught it. This workflow writes nothing and
# touches no tap.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  proof:
    uses: ./.github/workflows/install-proof.yml
    with:
      formula_path: tests/devtools/broken_cox.rb
      version: 999.0.0-negative-control
      expect_failure: true

  expect-failure:
    needs: proof
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless the proof rejected the broken formula on both platforms
        env:
          MACOS_OUTCOME: ${{ needs.proof.outputs.macos_outcome }}
          LINUX_OUTCOME: ${{ needs.proof.outputs.linux_outcome }}
        run: |
          echo "macos outcome: ${MACOS_OUTCOME}"
          echo "linux outcome: ${LINUX_OUTCOME}"
          test "${MACOS_OUTCOME}" = "failure" && test "${LINUX_OUTCOME}" = "failure"
